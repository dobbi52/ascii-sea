<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>글자 네온 골목</title>
<style>
html,body{margin:0;height:100%;background:#05040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#g{filter:blur(7px) saturate(1.7);opacity:.95;mix-blend-mode:screen;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;color:#fff;font:600 14px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;letter-spacing:.03em;text-shadow:0 1px 10px #000,0 0 3px #000;transition:opacity 1.4s;pointer-events:none;opacity:.9}
#hint small{display:block;font-weight:500;opacity:.75;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div id="hint">톡 · 쓱 · 꾸욱<small>간판 · 웅덩이 · 바람 · 꾹 눌러 가로등</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const gv=document.getElementById('g'),gx=gv.getContext('2d');
const hint=document.getElementById('hint');
const FONT='"SF Mono",ui-monospace,Menlo,Consolas,"Apple SD Gothic Neo","Noto Sans KR",monospace';
let W,H,dpr,cols,rows,cw,chH,fs,asp,n,fontStr;
let Z,PUD,RH,RD,OVk,OVc,OVs,HL;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random;
const cc=new Map();
function hsl(h,s,l){h=((h%360)+360)%360;h=(h/4|0)*4;s=cl(s,0,100);s=(s/5|0)*5;l=cl(l,0,100);l=(l/2|0)*2;
 const k=h*1000000+s*1000+l;let v=cc.get(k);if(!v){v='hsl('+h+','+s+'%,'+l+'%)';cc.set(k,v);}return v;}
const SND=(n,o)=>{try{if(parent!==window&&parent.SFX)parent.SFX.play(n,o);}catch(e){}},SNDSET=(k,v)=>{try{if(parent!==window&&parent.SFX)parent.SFX.set(k,v);}catch(e){}};
let tN=0,last=0,fid=0,NT=1,DAWN=0,DUSK=0,wind=0,windT=0,heavy=0,nextHeavy=40,litR=.5;
try{const m=location.hash.match(/^#t(\d+)$/);if(m)tN=+m[1];}catch(e){}

// ---------- world (seen from above, tilted) ----------
const ZROOF=1,ZWIN=2,ZSIGN=3,ZSHOP=4,ZEDGE=5,ZALLEY=6,ZSTREET=7,ZCROSS=8,ZGAP=9;
const A0=.34,A1=.66,ST0=.545,ST1=.62;
const BLOCKS=[
 {s:'L',w0:-.05,w1:.16,txt:'노래방',h:305,shop:'bar'},{s:'L',w0:.18,w1:.36,txt:'PC방',h:190,shop:'pc',bb:'dobbi.lab',bh:320},{s:'L',w0:.38,w1:.53,txt:'라멘',h:355,shop:'ramen'},
 {s:'L',w0:.635,w1:.8,txt:'호프',h:40,shop:'bar',bb:'CAFE',bh:30},{s:'L',w0:.82,w1:1.06,txt:'만화방',h:265,shop:'dark'},
 {s:'R',w0:-.05,w1:.13,txt:'당구장',h:125,shop:'dark'},{s:'R',w0:.15,w1:.33,txt:'24시',h:0,shop:'conv',bb:'치킨',bh:50},{s:'R',w0:.35,w1:.53,txt:'편의점',h:185,shop:'conv'},
 {s:'R',w0:.635,w1:.79,txt:'세탁',h:210,shop:'laundry'},{s:'R',w0:.81,w1:1.06,txt:'모텔',h:330,shop:'dark'}];
function sc(r){return lerp(.8,1.02,r/rows);}
function toUW(c,r){return[.5+(c+.5-cols/2)/(cols*sc(r)),(r+.5)/rows];}
function toCR(u,w){const r=w*rows;return[cols/2+(u-.5)*cols*sc(r)-.5,r-.5];}
let signs=[],roofs=[];
function build(){
 n=cols*rows;Z=new Uint8Array(n);PUD=new Float32Array(n);RH=new Int16Array(n).fill(-1);RD=new Float32Array(n);
 OVk=new Array(n);OVc=new Array(n);OVs=new Int32Array(n);HL=new Int32Array(n);
 signs=[];roofs=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c,[u,w]=toUW(c,r);
  let z;
  if(w>ST0&&w<ST1){z=ZSTREET;if(u>A0-.02&&u<A1+.02&&(w<ST0+.012||w>ST1-.012))z=ZCROSS;}
  else if(u>A0&&u<A1)z=ZALLEY;
  else{const L=u<=A0,b=BLOCKS.find(b=>b.s===(L?'L':'R')&&w>=b.w0&&w<b.w1);
   if(!b)z=ZGAP;else{const r1=Math.round(b.w1*rows)-1,fr=r1-r;
    const edge=L?Math.abs(u-A0)*cols*sc(r)<1.2:Math.abs(u-A1)*cols*sc(r)<1.2;
    if(fr<=4){z=fr===4?ZEDGE:fr>=2?ZWIN:fr===1?ZSIGN:ZSHOP;}else z=edge?ZEDGE:ZROOF;}}
  Z[i]=z;
  if(z===ZALLEY||z===ZSTREET||z===ZGAP){PUD[i]=cl((vn(c*.18,r*.3)-.5)*4,0,1);}
 }
 BLOCKS.forEach((b,k)=>{const L=b.s==='L',r1=Math.round(b.w1*rows)-1,rs=r1-1;
  const uc=L?(A0-.02)/2+.02:(1+A1)/2,[cc_]=toCR(uc,(rs+.5)/rows),chars=[...b.txt],wide=/[^\x00-\x7f]/.test(b.txt),wch=wide?2:1;
  const x0=Math.round(cc_-chars.length*wch/2);const g=chars.map((ch,q)=>({c:x0+q*wch,r:rs,ch,wide}));
  if(rs>=0&&rs<rows)signs.push({id:signs.length,hue:b.h,glyphs:g,zap:0,off:g.map(()=>0)});
  if(b.bb){const rr=Math.round(lerp(Math.max(0,b.w0),b.w1,.4)*rows),[c0]=toCR(L?.17:.83,(rr+.5)/rows),bc=[...b.bb],bw=/[^\x00-\x7f]/.test(b.bb)?2:1,x1=Math.round(c0-bc.length*bw/2);
   const gg=bc.map((ch,q)=>({c:x1+q*bw,r:rr,ch,wide:bw===2}));signs.push({id:signs.length,hue:b.bh,glyphs:gg,zap:0,off:gg.map(()=>0),bb:{c0:x1-2,c1:x1+bc.length*bw+1,r0:rr-1,r1:rr+1}});}
  const rr0=Math.max(1,Math.round(b.w0*rows)+1),rr1=r1-6;
  for(let q=0;q<6;q++){const r=Math.round(lerp(rr0,rr1,hash(k,q))),u=L?lerp(.03,.3,hash(q,k+9)):lerp(.7,.97,hash(q,k+9));if(r<rr0||r>rr1)continue;const [c]=toCR(u,(r+.5)/rows);
   if(signs.some(s=>s.bb&&r>=s.bb.r0-1&&r<=s.bb.r1+1&&c>=s.bb.c0-2&&c<=s.bb.c1+2))continue;
   roofs.push({c:Math.round(c),r,t:['ac','ac','tank','ant','cloth','plant'][(hash(k*3,q)*6)|0],ph:hash(q,k)*9});}
 });
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;if(Z[i]!==ZALLEY&&Z[i]!==ZSTREET&&Z[i]!==ZGAP&&Z[i]!==ZCROSS)continue;
  let best=-1,bd=1e9;for(const s of signs){const g=s.glyphs[(s.glyphs.length/2)|0],d=Math.hypot(c-g.c,(r-g.r)*1.8);if(d<bd){bd=d;best=s.id;}}
  if(bd<16){RH[i]=best;RD[i]=1-bd/16;}}
 initLife();
}

// ---------- life ----------
let people=[],cars=[],bike=null,nextBike=10,cat=null,lamps=[],rain=[],splash=[],rings=[],sparks=[],nextP=1,nextCar=2,smoker=null;
function initLife(){people=[];cars=[];for(let k=0;k<7;k++)spawnPerson(rnd());lamps=[];rings=[];splash=[];sparks=[];bike=null;
 cat={x:0,r:0,st:'sleep',t:8,tx:0,ty:0,fl:0};{const [c]=toCR(.2,.585);cat.x=c;cat.r=Math.round(.585*rows);cat.tx=cat.x;cat.ty=cat.r;}
 rain=[];for(let k=0;k<170;k++)rain.push({x:rnd()*W,y:rnd()*H,v:500+rnd()*260,l:rnd()});
 smoker={b:1,t:0};}
function spawnPerson(w0){const down=rnd()<.5;people.push({u:lerp(A0+.05,A1-.05,rnd()),w:w0!==undefined?w0:(down?-.04:1.04),dir:down?1:-1,sp:.022+rnd()*.018,h:[300,190,40,0,140,55,270,330][(rnd()*8)|0],fl:rnd()*9,wob:0});}
function putN(c,r,ch,col){c=Math.round(c);r=Math.round(r);if(c<0||r<0||c>=cols||r>=rows)return;const i=r*cols+c;OVk[i]=ch;OVc[i]=col;OVs[i]=fid;}
function putH(c,r,ch,col){c=Math.round(c);r=Math.round(r);if(c<0||r<0||c>=cols||r>=rows)return;putN(c,r,ch,col);const i=r*cols+c;if(c>0)HL[i-1]=fid;if(c<cols-1)HL[i+1]=fid;if(r>0)HL[i-cols]=fid;if(r<rows-1)HL[i+cols]=fid;}
function spark(c,r,ch,col,life,vx,vy){if(sparks.length<200)sparks.push({c,r,ch,col,a:0,life,vx,vy});}
function inCross(p){return p.w>ST0-.01&&p.w<ST1+.01;}
function updLife(dt){
 nextP-=dt;if(nextP<0){nextP=1.8+rnd()*3;if(people.length<12)spawnPerson();}
 for(let k=people.length-1;k>=0;k--){const p=people[k];p.fl+=dt*5;p.wob+=(wind-p.wob)*dt*3+(rnd()-.5)*dt*Math.abs(wind)*5;
  p.w+=p.dir*p.sp*dt*(heavy>0?1.4:1);if(p.w<-.06||p.w>1.06){people.splice(k,1);continue;}
  const [c,r]=toCR(p.u,p.w),st=((p.fl)|0)%2,ub=hsl(p.h,95,58-DAWN*15),rim=hsl(p.h,70,40),flip=Math.abs(p.wob)>1.7,sh=p.wob>.6?1:p.wob<-.6?-1:0;
  if(flip){putH(c-1,r,'\\',ub);putH(c,r,'v',rim);putH(c+1,r,'/',ub);putH(c,r+1,'o',hsl(28,25,55));}
  else{putH(c-1+sh,r,'/',ub);putH(c+sh,r,'^',ub);putH(c+1+sh,r,'\\',ub);putH(c-1,r+1,'(',rim);putH(c,r+1,st?'_':'.',rim);putH(c+1,r+1,')',rim);}}
 nextCar-=dt;if(nextCar<0){nextCar=3+rnd()*4;const R_=rnd()<.5;cars.push({x:R_?-8:cols+8,d:R_?1:-1,h:[0,210,50,140,0,0][(rnd()*6)|0],s:rnd()<.5,v:9+rnd()*4});}
 const walking=people.some(p=>inCross(p));
 for(let k=cars.length-1;k>=0;k--){const C=cars[k],lane=C.d>0?lerp(ST0,ST1,.68):lerp(ST0,ST1,.32),[cA]=toCR(A0-.02,lane),[cB]=toCR(A1+.02,lane);
  const front=C.x+C.d*4,stopLine=C.d>0?cA-2:cB+2,before=C.d>0?front<stopLine+1:front>stopLine-1,near=Math.abs(front-stopLine)<5;
  C.go=!(walking&&before&&near);C.cur=(C.cur===undefined?C.v:C.cur);C.cur+=((C.go?C.v:0)-C.cur)*dt*2.5;C.x+=C.d*C.cur*dt;
  if(C.x<-12||C.x>cols+12){cars.splice(k,1);continue;}
  const r=Math.round(lane*rows),x=Math.round(C.x),body=C.h===0&&C.s?hsl(0,0,80):hsl(C.h,45,42),dark=hsl(220,20,22);
  const mid=C.d>0?['|','=','#','#','=','>']:['<','=','#','#','=','|'];
  for(let q=0;q<6;q++){putH(x-3+q,r-1,q===0||q===5?'.':'_',body);putH(x-3+q,r,mid[q],q===2||q===3?dark:body);}
  const hx=C.d>0?x+3:x-4;putN(hx,r,'*',hsl(55,100,85));putN(C.d>0?x-4:x+3,r,'.',hsl(0,95,55));
  for(let q=1;q<9;q++)if(rnd()<.55)putN(hx+C.d*q,r+(rnd()<.5?-1:0)+(q>4&&rnd()<.4?1:0),'.',hsl(52,90,55+(9-q)*3));
  if(!C.go&&((tN*3)|0)%2)putN(C.d>0?x-4:x+3,r-1,'.',hsl(0,95,65));}
 if(!bike&&tN>nextBike){bike={w:rnd()<.5?-.05:1.05,u:lerp(A0+.08,A1-.08,rnd())};bike.dir=bike.w<0?1:-1;SND('bike');}
 if(bike){bike.w+=bike.dir*.18*dt;if(bike.w<-.08||bike.w>1.08){bike=null;nextBike=tN+16+rnd()*12;}else{
  const [c,r]=toCR(bike.u,bike.w);putH(c,r,'O',hsl(0,80,55));putH(c,r+(bike.dir>0?-1:1),'=',hsl(220,15,50));putH(c,r+(bike.dir>0?1:-1),'@',hsl(55,100,85));
  for(let q=2;q<10;q++)for(let w=-1;w<=1;w++)if(rnd()<.5)putN(c+w*(q>5?2:1),r+bike.dir*q,'.',hsl(52,90,55+(10-q)*3));}}
 const K=cat;K.t-=dt;K.fl+=dt;
 if(K.st==='sleep'&&K.t<0){K.st='walk';const [c]=toCR(K.x<cols/2?.82:.18,.585);K.tx=c;K.ty=Math.round(.585*rows);}
 if(K.st==='walk'||K.st==='come'){const sp=K.st==='come'?10:4,dx=K.tx-K.x,dy=K.ty-K.r,d=Math.hypot(dx,dy*asp)+.01;const m=Math.min(d,sp*dt);K.x+=dx/d*m;K.r+=dy*asp/d*m/asp;
  if(d<.6){if(K.st==='come'){K.st='rub';K.t=4;SND('purr');}else{K.st='sleep';K.t=15+rnd()*10;}}}
 if(K.st==='rub'){if(rnd()<dt*2)spark(K.x+2,K.r-1,'<3',hsl(340,90,70),.8,0,-1.5);if(K.t<0){K.st='walk';const [c]=toCR(rnd()<.5?.82:.18,.585);K.tx=c;K.ty=Math.round(.585*rows);}}
 {const x=Math.round(K.x),r=Math.round(K.r),col=hsl(30,15,64),e=hsl(55,90,65),R_=K.tx>=K.x;
  if(K.st==='sleep'){putH(x-1,r,'(',col);putH(x,r,'@',col);putH(x+1,r,')',col);if(((tN*1.2)|0)%2)putN(x+2,r-1,'z',hsl(220,40,70));}
  else{const s=R_?['~','(','o','.','o',')']:['(','o','.','o',')','~'];s.forEach((ch,q)=>putH(x-3+q,r,ch,ch==='o'?e:col));putH(x+(R_?-1:-2),r-1,'^',col);putH(x+(R_?1:0),r-1,'^',col);}}
 for(const L of lamps){L.a=Math.min(1,L.a+dt*1.5);const rad=4.5*L.a;
  for(let y=-3;y<=3;y++)for(let x=-6;x<=6;x++){const d=Math.hypot(x/1.5,y*1.1);if(d<rad&&rnd()<.55)putN(L.c+x,L.r+y,d<rad*.4?':':'.',hsl(50,90,50+(1-d/rad)*30));}
  putH(L.c,L.r,'#',hsl(220,10,55));putN(L.c,L.r-1,((tN*20)|0)%37?'*':'.',hsl(52,100,88));}
 smoker.t-=dt;if(smoker.t<0){smoker.t=4+rnd()*3;smoker.b=1;}
 if(NT>.3){const [c]=toCR(.9,.7),r=Math.round(.7*rows);putH(c,r,'o',hsl(28,25,55));putN(c+1,r,'-',hsl(0,0,70));putN(c+2,r,smoker.b>.5?'*':'.',hsl(20,100,55+smoker.b*20));smoker.b*=Math.exp(-dt*.8);
  if(rnd()<dt*1.5)spark(c+2,r-1,rnd()<.5?'~':'.',hsl(220,8,55),1.6,(rnd()-.3)*1.5+wind*2,-1.2);}
 for(let k=sparks.length-1;k>=0;k--){const p=sparks[k];p.a+=dt;if(p.a>p.life){sparks.splice(k,1);continue;}p.c+=p.vx*dt;p.r+=p.vy*dt;for(let q=0;q<p.ch.length;q++)putN(p.c+q,p.r,p.ch[q],p.col);}
 for(let k=splash.length-1;k>=0;k--){const s=splash[k];s.t+=dt;if(s.t>.25){splash.splice(k,1);continue;}putN(s.c,s.r,s.t<.12?"'":'.',hsl(200,40,75));}
}
function drawSigns(dt){
 const dim=1-DAWN*.55;
 for(const s of signs){s.zap=Math.max(0,s.zap-dt);const dead=DAWN>.5&&hash(s.id,9)<.4;
  if(s.bb){const fc=hsl(s.hue,50,(dead?14:30)*dim);for(let c=s.bb.c0;c<=s.bb.c1;c++){putH(c,s.bb.r0,c===s.bb.c0||c===s.bb.c1?'+':'-',fc);putH(c,s.bb.r1,c===s.bb.c0||c===s.bb.c1?'+':'-',fc);}putH(s.bb.c0,s.bb.r0+1,'|',fc);putH(s.bb.c1,s.bb.r0+1,'|',fc);}
  s.glyphs.forEach((g,q)=>{if(rnd()<dt*.05)s.off[q]=.08+rnd()*.3;s.off[q]=Math.max(0,s.off[q]-dt);
   let on=!dead&&s.off[q]<=0;if(s.zap>0)on=((tN*30+q)|0)%3!==0;
   const col=on?hsl(s.hue,100,(60+10*Math.sin(tN*2+s.id))*dim):hsl(s.hue,25,18);
   putH(g.c,g.r,g.ch,col);if(g.wide)putN(g.c+1,g.r,' ',col);});
  if(s.bb&&s.glyphs.length>6&&((tN*2)|0)%2)putN(s.glyphs[s.glyphs.length-1].c+1,s.glyphs[0].r,'_',hsl(s.hue,100,70));}
}
function roofProps(){
 for(const p of roofs){const x=p.c,r=p.r,g=hsl(225,10,38);
  if(p.t==='ac'){putH(x-1,r,'[',g);putH(x,r,'+x'[((tN*8+p.ph)|0)%2],hsl(220,10,58));putH(x+1,r,']',g);}
  else if(p.t==='tank'){putH(x-1,r-1,'.',g);putH(x,r-1,'-',g);putH(x+1,r-1,'.',g);putH(x-1,r,'(',g);putH(x,r,'O',hsl(200,20,50));putH(x+1,r,')',g);}
  else if(p.t==='ant'){putH(x,r,'Y',g);if(((tN*1.3+p.ph)|0)%4===0)putN(x,r-1,'.',hsl(0,90,60));}
  else if(p.t==='cloth'){for(let q=-3;q<=3;q++){putN(x+q,r-1,'-',hsl(30,10,45));if(q%2===0){const f=Math.sin(tN*3+q+p.ph+wind*2);putH(x+q+(f>.6?1:0)+(wind>1?1:wind<-1?-1:0),r,'nmhu'[(q+3)%4],hsl([0,210,50,300][(q+3)%4],60,55));}}}
  else putH(x,r,'*',hsl(120,50,40));}
}

// ---------- render ----------
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=W*dpr|0;cv.height=H*dpr|0;ctx.setTransform(1,0,0,1,0,0);ctx.font='bold 20px '+FONT;
 const k=ctx.measureText('M').width/20||.6;
 cw=Math.max(5.6,Math.min(9,W/64));fs=cw/k;chH=fs*1.1;cols=Math.ceil(W/cw);rows=Math.ceil(H/chH);asp=chH/cw;
 fontStr='bold '+fs.toFixed(2)+'px '+FONT;gv.width=Math.ceil(W/3);gv.height=Math.ceil(H/3);
 build();
}
function shopCell(b,c,r,rn){
 switch(b.shop){
  case 'conv':return[hash(c,7)<.3?'|':rn<.5?':':'=',hsl(185,45,62)];
  case 'ramen':return[(c%2)?'|':':',hsl(355,75,48)];
  case 'laundry':return[(c%3)===1?'o':'.',hsl(210,45,52)];
  case 'pc':return[rn<.5?'#':'=',hsl(190,60,40+25*Math.abs(Math.sin(tN*4+c)))];
  case 'bar':return[rn<.5?'.':'"',hsl(285,70,34+18*Math.sin(tN*2+c*.3))];
  default:return['=',hsl(230,8,24)];}}
function frame(now){
 const t=now/1000,dt=Math.min(.05,last?t-last:.016);last=t;tN+=dt;fid++;
 const p=((tN+20)/150)%1;DUSK=p<.18?1-p/.18:0;DAWN=p>.78?(p-.78)/.22:0;NT=1-Math.max(DUSK,DAWN);litR=.62-.32*cl((p-.2)/.58,0,1)-(p>.78?.1:0);
 windT*=Math.exp(-dt*.8);wind+=(windT+Math.sin(tN*.3)*.15-wind)*dt*2;
 nextHeavy-=dt;if(nextHeavy<0&&heavy<=0){heavy=12+rnd()*6;nextHeavy=40+rnd()*30;SND('thunder');}heavy=Math.max(0,heavy-dt);
 const hv=heavy>0?Math.max(0,Math.min(1,heavy/2,(16-heavy)/2)):0;
 if((fid&31)===0){SNDSET('rain',.35+hv*.65);SNDSET('night',NT);}
 drawSigns(dt);roofProps();updLife(dt);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const bg=DUSK>0?`rgb(${18+DUSK*30|0},${12+DUSK*8|0},${30+DUSK*16|0})`:DAWN>0?`rgb(${14+DAWN*40|0},${12+DAWN*18|0},${26+DAWN*20|0})`:'#0b0a18';
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.font=fontStr;ctx.textBaseline='top';
 let lastCol='';const draw=(ch,col,c,r)=>{if(col!==lastCol){ctx.fillStyle=col;lastCol=col;}ctx.fillText(ch,c*cw,r*chH);};
 const sky=DUSK>0?250+DUSK*40:DAWN>0?330:240;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const i=r*cols+c;
  if(OVs[i]===fid){if(OVk[i]!==' ')draw(OVk[i],OVc[i],c,r);continue;}
  if(HL[i]===fid)continue;
  const z=Z[i],rn=hash(c*7+3,r*13+5);
  if(z===ZROOF){if(rn<.3)draw(rn<.08?':':'.',hsl(sky,12,18+DUSK*8+DAWN*10),c,r);else if(rn<.34)draw('_',hsl(sky,10,22),c,r);continue;}
  if(z===ZEDGE){draw(rn<.5?'_':'=',hsl(240,12,34),c,r);continue;}
  if(z===ZWIN){const id=c*31+r*7;if(c%3===0){draw('|',hsl(245,15,22),c,r);continue;}
   const lit=hash(id,3)<litR+(hash(id,Math.floor(tN/7))<.06?.35:0);
   if(lit){const warm=hash(id,8)<.6,tv=hash(id,9)<.12;draw(rn<.5?'#':'=',tv?hsl(210,70,40+25*Math.abs(Math.sin(tN*6+id))):hsl(warm?40:180,warm?75:45,warm?54:46),c,r);}
   else draw('.',hsl(240,15,16),c,r);continue;}
  if(z===ZSIGN){draw('-',hsl(240,12,20),c,r);continue;}
  if(z===ZSHOP){const [u,w]=toUW(c,r),b=BLOCKS.find(b=>b.s===(u<.5?'L':'R')&&w>=b.w0-.02&&w<b.w1+.02);if(b){const s=shopCell(b,c,r,rn);draw(s[0],s[1],c,r);}continue;}
  const pud=PUD[i],rh=RH[i];
  let rg=0,big=0;for(const g of rings){const life=g.big?1.2:.5,a=tN-g.t;if(a>life)continue;const R=a*(g.big?9:5),d=Math.hypot(c-g.c,(r-g.r)*2.4);if(Math.abs(d-R)<.6){const v=1-a/life;if(v>rg){rg=v;big=g.big;}}}
  if(rg>0){draw(big?(rg>.5?'o':'~'):'.',hsl(200,50,big?35+rg*45:30+rg*25),c,r);continue;}
  if(rh>=0&&(pud>.2||rn<RD[i]*.6)){const s=signs[rh],on=s&&s.off.every(x=>x<=0);const a=(pud>.2?.9:.5)*RD[i];
   draw(rn<.5?'~':'-',hsl(s?s.hue:200,85,(12+a*36)*(on?1:.5)),c,r);continue;}
  if(z===ZCROSS){const [u]=toUW(c,r);if(((u*60)|0)%2)draw('=',hsl(0,0,70),c,r);continue;}
  if(z===ZSTREET){const [u,w]=toUW(c,r);if(Math.abs(w-(ST0+ST1)/2)<.004&&((c+(tN|0))%4)<2){draw('-',hsl(48,80,50),c,r);continue;}if(pud>.2){draw('~',hsl(230,25,16+pud*8),c,r);continue;}if(rn<.2)draw('.',hsl(230,10,20),c,r);continue;}
  if(z===ZGAP){if(rn<.18)draw(rn<.05?'%':'.',hsl(240,10,15),c,r);continue;}
  if(pud>.2){draw(rn<.5?'-':'~',hsl(230,30,15+pud*10),c,r);continue;}
  if(rn<.22)draw(rn<.06?',':'.',hsl(235,12,19),c,r);
  else if(rn>.985)draw(rn>.995?'O':'#',hsl(220,10,30),c,r);
 }
 for(let k=rings.length-1;k>=0;k--)if(tN-rings[k].t>1.2)rings.splice(k,1);
 const tilt=wind*.35+.1,cnt=Math.round(110+hv*60);
 for(let k=0;k<rain.length&&k<cnt;k++){const d=rain[k];d.y+=d.v*dt*(1+hv*.4);d.x+=d.v*dt*tilt;
  let land=d.y>H||d.x>W+20||d.x<-20||rnd()<.006;
  if(land){const c=Math.round(d.x/cw),rr=Math.round(d.y/chH);if(c>=0&&c<cols&&rr>=0&&rr<rows&&rnd()<.6){const i=rr*cols+c;if(PUD[i]>.2&&rnd()<.35)rings.push({c,r:rr,t:tN});else splash.push({c,r:rr,t:0});}
   d.y=-10-rnd()*80;d.x=rnd()*(W+200)-100-tilt*200;continue;}
  ctx.fillStyle=`hsla(${200+d.l*60|0},40%,${70+d.l*15|0}%,${(.2+d.l*.25+hv*.15).toFixed(2)})`;ctx.fillText(Math.abs(tilt)>.35?(tilt>0?'\\':'/'):'|',d.x,d.y);}
 if(hv>0){ctx.fillStyle=`rgba(20,25,40,${(hv*.16).toFixed(3)})`;ctx.fillRect(0,0,W,H);}
 if(DAWN>0){ctx.fillStyle=`rgba(255,150,170,${(DAWN*.07).toFixed(3)})`;ctx.fillRect(0,0,W,H);}
 gx.clearRect(0,0,gv.width,gv.height);gx.drawImage(cv,0,0,gv.width,gv.height);
 requestAnimationFrame(frame);
}

// ---------- touch ----------
let held=false,touched=false,px0=0,py0=0,downT=0,moved=false,lp=false,lx=0,lt=0;
function tap(x,y){const c=x/cw,r=y/chH,ci=Math.floor(c),ri=Math.floor(r);
 for(const s of signs){if(s.glyphs.some(g=>Math.abs(g.c-c)<=2.5&&Math.abs(g.r-r)<=1.5)){s.zap=.7;s.hue=(s.hue+50+rnd()*80)%360;SND('zap');return;}}
 for(const p of people){const [pc,pr]=toCR(p.u,p.w);if(Math.abs(pc-c)<2.5&&Math.abs(pr-r)<2){p.dir*=-1;p.wob=2.2;SND('whoosh',{v:.3});return;}}
 if(cat&&Math.abs(cat.x-c)<3&&Math.abs(cat.r-r)<2){SND('purr');spark(cat.x+1,cat.r-1,'?',hsl(50,90,70),.6,0,-1);if(cat.st==='sleep')cat.t=0;return;}
 if(ci>=0&&ci<cols&&ri>=0&&ri<rows){const z=Z[ri*cols+ci];
  if(z===ZALLEY||z===ZSTREET||z===ZGAP||z===ZCROSS){rings.push({c,r,t:tN,big:1});for(let q=0;q<6;q++)spark(c,r,['.',"'",','][q%3],hsl(200,50,80),.4,(rnd()-.5)*10,-3-rnd()*5);SND('splash');return;}}
 SND('tick');
}
function longPress(x,y){const c=Math.round(x/cw),r=Math.round(y/chH);if(c<0||c>=cols||r<0||r>=rows)return;const z=Z[r*cols+c];
 if(z!==ZALLEY&&z!==ZSTREET&&z!==ZGAP&&z!==ZCROSS)return;lamps.push({c,r,a:0});if(lamps.length>3)lamps.shift();SND('zap');
 if(cat){cat.st='come';cat.tx=c+(cat.x<c?-3:3);cat.ty=r;}}
addEventListener('pointerdown',e=>{held=true;moved=false;lp=false;px0=lx=e.clientX;py0=e.clientY;downT=tN;lt=e.timeStamp;tap(e.clientX,e.clientY);if(!touched){touched=true;hint.style.opacity=0;}});
addEventListener('pointermove',e=>{if(!held)return;const x=e.clientX,y=e.clientY;if(!moved&&Math.hypot(x-px0,y-py0)>12)moved=true;
 if(moved){const dtm=Math.max(8,e.timeStamp-lt)/1000,vx=(x-lx)/W/dtm;windT=cl(windT+vx*.25,-3,3);if(Math.abs(vx)>.8)SND('whoosh',{v:Math.abs(vx)/3,min:300});}
 lx=x;lt=e.timeStamp;});
addEventListener('pointerup',()=>{held=false;});
addEventListener('pointercancel',()=>{held=false;});
addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(held&&!moved&&!lp&&tN-downT>.45){lp=true;longPress(px0,py0);}},60);
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
</script>
