<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>글자 모닥불</title>
<style>
html,body{margin:0;height:100%;background:#05050a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#g{filter:blur(8px) saturate(1.4);opacity:.85;mix-blend-mode:screen;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;color:#fff;font:600 14px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;letter-spacing:.03em;text-shadow:0 1px 10px #000,0 0 3px #000;transition:opacity 1.4s;pointer-events:none;opacity:.9}
#hint small{display:block;font-weight:500;opacity:.75;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div id="hint">쓱쓱 · 톡 · 꾸욱<small>바람 · 불티 · 장작 넣기 · 마시멜로 톡</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const gv=document.getElementById('g'),gx=gv.getContext('2d');
const hint=document.getElementById('hint');
const FONT='"SF Mono",ui-monospace,Menlo,Consolas,monospace';
let W,H,dpr,cols,rows,cw,chH,fs,asp,n,fontStr;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random;
const cc=new Map();
function hsl(h,s,l){h=((h%360)+360)%360;h=(h/4|0)*4;s=cl(s,0,100);s=(s/5|0)*5;l=cl(l,0,100);l=(l/2|0)*2;
 const k=h*1000000+s*1000+l;let v=cc.get(k);if(!v){v='hsl('+h+','+s+'%,'+l+'%)';cc.set(k,v);}return v;}
const SND=(n,o)=>{try{if(parent!==window&&parent.SFX)parent.SFX.play(n,o);}catch(e){}},SNDSET=(k,v)=>{try{if(parent!==window&&parent.SFX)parent.SFX.set(k,v);}catch(e){}};
let tN=0,last=0,fid=0,acc=0,wind=0,fuel=1,glowK=1,pumpT=0;

// ---------- 배치 ----------
let HT,H2,TM,OVk,OVc,OVs,OVb,OVbs,CX,BASE,FH,BW,HOR,trees=[],stones=[],embers=[],smoke=[],flies=[],logs=[],falling=[],texts=[],owl=null,mm=null;
function build(){
 n=cols*rows;HT=new Float32Array(n);H2=new Float32Array(n);TM=new Uint8Array(n);OVk=new Array(n);OVc=new Array(n);OVs=new Int32Array(n);OVb=new Array(n);OVbs=new Int32Array(n);
 const L=W>H;CX=Math.round(cols/2);BASE=Math.round(rows*(L?.86:.8));FH=Math.round(rows*(L?.8:.66));BW=Math.round(L?Math.min(cols*.36,FH*asp*.85):cols*.66);HOR=Math.round(rows*(L?.5:.52));
 // 나무 실루엣: 뒤쪽 작은 나무 + 양옆 큰 나무
 trees=[];
 for(let x=-2;x<cols+4;x+=3+hash(x,1)*5){const h=5+hash(x,2)*(rows*.16);trees.push({x,b:HOR+1,h,w:h*.42*asp*.55,far:1});}
 const side=L?[[.02,.95],[.11,.75],[.9,.8],[.98,.98]]:[[.0,.85],[.12,.62],[.9,.7],[1.02,.9]];
 for(const [u,hh] of side){const h=rows*hh*.62;trees.push({x:Math.round(u*cols),b:Math.round(rows*(L?.96:.9)),h,w:h*.36*asp*.55,far:0});}
 TM.fill(0);
 for(const t of trees){const top=t.b-t.h;for(let r=Math.max(0,Math.floor(top));r<=Math.min(rows-1,t.b);r++){const k=(r-top)/t.h,tier=(k*4)%1,ww=t.w*(k*.75+tier*.35)+.6;
  for(let c=Math.floor(t.x-ww);c<=Math.ceil(t.x+ww);c++){if(c<0||c>=cols)continue;const i=r*cols+c,d=c-t.x;const v=Math.abs(d)>ww-1?(d<0?2:3):1;if(TM[i]===0||(t.far===0))TM[i]=v+(t.far?0:4);}}
  for(let r=Math.floor(t.b);r<=Math.min(rows-1,t.b+(t.far?1:3));r++){const i=r*cols+Math.round(t.x);if(i>=0&&i<n&&r<rows)TM[i]=t.far?9:10;}}
 // 돌 테두리
 stones=[];const rx=BW*.62;for(let k=0;k<26;k++){const a=k/26*Math.PI*2,x=CX+Math.cos(a)*rx,y=BASE+1+Math.sin(a)*rx/asp*.32;if(Math.sin(a)<-.2)continue;stones.push({x:Math.round(x),y:Math.round(y),big:hash(k,4)<.5});}
 // 장작
 logs=[{x0:CX-BW*.48,y0:BASE+1,x1:CX+BW*.12,y1:BASE-2},{x0:CX+BW*.48,y0:BASE+1,x1:CX-BW*.12,y1:BASE-2},{x0:CX-BW*.38,y0:BASE,x1:CX+BW*.38,y1:BASE}];
 flies=[];for(let k=0;k<7;k++)flies.push({x:rnd()*cols,y:HOR+rnd()*(rows-HOR),vx:0,vy:0,ph:rnd()*9});
 embers=[];smoke=[];falling=[];texts=[];owl=null;nextOwl=25;
 mm={t:0,burn:0,state:'on',k:0};
 const P=W<=H;
 KT={x:Math.max(6,Math.round(CX-BW*.66-(cols>=120?3:0))),y:BASE+1,h:.2,wt:0,cup:0,shake:0};
 CAT={x:Math.max(1,Math.round(P?CX-BW*.34:(cols>=120?KT.x-30:CX-BW*.95-4))),y:P?BASE+8:BASE+1,st:'sleep',t:0,tail:0,meow:0};
 PT={x:Math.round(CX+BW*(P?.3:.58)),y:P?BASE+4:BASE+1,st:'bury',t:0};
 TENT={x:Math.round(cols*(P?.2:.2)),b:HOR+(P?3:2),on:true};
 star=null;nextStar=6;
 for(let k=0;k<80;k++)step(1/30);
}
let nextOwl=25,KT,CAT,PT,TENT,star=null,nextStar=8;const stm=[],zz=[],hearts=[];

// ---------- 불 시뮬레이션 ----------
function step(dt){
 const fz=.6+.4*fuel,t=tN,o=wind*.32;
 // 열원: 장작 위
 for(let x=0;x<cols;x++){const dx=(x-CX)/(BW*.5);if(Math.abs(dx)>1.15)continue;const fall=Math.max(0,1-dx*dx*.85);
  for(let y=BASE-1;y<=BASE;y++){const nz=vn(x*.3,t*4.5+y)*.6+vn(x*.8,t*9)*.4;HT[y*cols+x]=fall*(.55+.85*nz*nz)*Math.min(1.25,fz)*(1+pumpT*.3);}}
 // 위로 올라가며 식기 (둠 파이어 방식 + 큰 혀 모양 노이즈)
 const y0=Math.max(1,BASE-Math.round(FH*1.6)),base=1/(FH*fz);
 for(let y=y0;y<BASE-1;y++){const rowK=(BASE-y)/FH;
  for(let x=1;x<cols-1;x++){const j=(y+1)*cols+x;
   let src=x+((rnd()*3)|0)-1;const sh=o*.9;if(rnd()<Math.abs(sh)%1)src-=Math.sign(sh);src-=Math.trunc(sh);
   src=cl(src,0,cols-1);let h=HT[(y+1)*cols+src]*.7+HT[j]*.3;
   const nz=vn(x*.16+t*.4,(y+t*30)*.07),dx=(x-CX-o*rowK*FH*.3)/(BW*.5);
   h-=rnd()*base*1.65*(1+rowK*rowK*.5)*(.3+nz*nz*2.4)+Math.max(0,Math.abs(dx)-.35+rowK*.25)*base*3.2;
   H2[y*cols+x]=h>0?h:0;}}
 for(let y=y0;y<BASE-1;y++)for(let x=0;x<cols;x++)HT[y*cols+x]=H2[y*cols+x];
}
function inject(cx,cy,rad,amt){for(let r=Math.floor(cy-rad/asp);r<=cy+rad/asp;r++)for(let c=Math.floor(cx-rad);c<=cx+rad;c++){if(c<0||r<0||c>=cols||r>=BASE)continue;const d=Math.hypot(c-cx,(r-cy)*asp)/rad;if(d<1)HT[r*cols+c]=Math.min(1.3,HT[r*cols+c]+amt*(1-d));}}
const RAMP=".'^*%#@@";
function fireCh(h,rn){const k=Math.min(7,Math.floor(h*7.5+rn*.7-.3));return RAMP[Math.max(0,k)];}
function fireCol(h){if(h>.92)return hsl(52,100,90);return hsl(h*56,100,cl(18+h*68,10,84));}

// ---------- 업데이트 ----------
function putN(c,r,ch,col){c=Math.round(c);r=Math.round(r);if(c<0||r<0||c>=cols||r>=rows)return;const i=r*cols+c;OVk[i]=ch;OVc[i]=col;OVs[i]=fid;}
function putB(c,r,bg){c=Math.round(c);r=Math.round(r);if(c<0||r<0||c>=cols||r>=rows)return;const i=r*cols+c;OVb[i]=bg;OVbs[i]=fid;}
function str(c,r,s,col){for(let q=0;q<s.length;q++)if(s[q]!==' ')putN(c+q,r,s[q],typeof col==='function'?col(s[q],q):col);}
function burst(x,y,k,sp){for(let q=0;q<k;q++)embers.push({x:x+(rnd()-.5)*4,y:y-rnd()*2,vx:(rnd()-.5)*sp,vy:-(4+rnd()*sp*1.4),a:0,life:1.2+rnd()*2.2});}
function update(dt){
 wind+=(.25*Math.sin(tN*.23)+.15*Math.sin(tN*.71)-wind)*Math.min(1,dt*.8);
 fuel=Math.max(.7,fuel-dt*.012);pumpT=Math.max(0,pumpT-dt);
 SNDSET('fire',cl(fuel/1.6,0,1));
 // 불티
 if(rnd()<dt*(3+fuel*4))burst(CX+(rnd()-.5)*BW*.5,BASE-2-rnd()*FH*.3,1,3);
 if(rnd()<dt*.35*fuel){burst(CX+(rnd()-.5)*BW*.4,BASE-2,6+rnd()*8,6);SND('crackle',{min:300});if(rnd()<.25)startle(CX,BASE);}
 for(let k=embers.length-1;k>=0;k--){const e=embers[k];e.a+=dt;e.vx+=(wind*3-e.vx)*dt*.8+(rnd()-.5)*dt*8;e.vy+=(-3-e.vy)*dt*.6;e.x+=e.vx*dt;e.y+=e.vy*dt/asp*1.6;if(e.a>e.life||e.y<0||e.x<0||e.x>=cols)embers.splice(k,1);}
 // 연기
 if(rnd()<dt*5)smoke.push({x:CX+wind*FH*.25+(rnd()-.5)*BW*.25,y:BASE-FH*(.85+rnd()*.3),a:0,life:4+rnd()*3});
 for(let k=smoke.length-1;k>=0;k--){const s=smoke[k];s.a+=dt;s.y-=dt*2.2;s.x+=(wind*2.5+Math.sin(s.a*1.3+k)*.6)*dt;if(s.a>s.life||s.y<0)smoke.splice(k,1);}
 // 반딧불
 for(const f of flies){f.vx+=(rnd()-.5)*dt*6;f.vy+=(rnd()-.5)*dt*3;f.vx*=.97;f.vy*=.97;f.x+=f.vx*dt;f.y+=f.vy*dt;
  const dx=f.x-CX,dy=(f.y-BASE)*asp;if(Math.hypot(dx,dy)<BW*.9){f.vx+=Math.sign(dx||1)*dt*4;}
  if(f.y<HOR-6)f.vy+=dt*2;if(f.y>rows-2)f.vy-=dt*2;if(f.x<1)f.vx+=dt*3;if(f.x>cols-2)f.vx-=dt*3;}
 // 떨어지는 장작
 for(let k=falling.length-1;k>=0;k--){const g=falling[k];g.vy+=dt*40;g.y+=g.vy*dt;if(g.y>=BASE-1){falling.splice(k,1);fuel=Math.min(1.8,fuel+.45);pumpT=1.2;SND('thud');setTimeout(()=>SND('crackle'),120);burst(CX,BASE-2,40,9);startle(CX,BASE);inject(CX,BASE-3,BW*.35,.6);}}
 // 부엉이
 nextOwl-=dt;if(!owl&&nextOwl<0){const t=trees.find(t=>t.far===0&&t.x>5&&t.x<cols*.3)||trees.find(t=>t.far===0&&t.x>5);owl={x:Math.round(t.x)-2,y:Math.round(t.b-t.h*.55),a:0,life:14,blink:0};nextOwl=40+rnd()*30;setTimeout(()=>SND('hoot'),600);}
 if(owl){owl.a+=dt;owl.blink-=dt;if(owl.blink<-3)owl.blink=.18;if(owl.a>owl.life)owl=null;}
 // 주전자
 KT.h=Math.min(1.2,KT.h+dt/28*(.6+fuel*.4));KT.shake=KT.h>=1?1:0;
 if(KT.h>=1){KT.wt-=dt;if(KT.wt<0){KT.wt=4;SND('whistle');}}
 if(rnd()<dt*(KT.h>=1?14:KT.h*3))stm.push({x:KT.sp?KT.sp[0]:KT.x+3,y:KT.sp?KT.sp[1]:KT.y-2,a:0,vx:KT.h>=1?2.5:.6,life:KT.h>=1?1.6:2.4});
 if(KT.cup>0){KT.cup-=dt;if(rnd()<dt*3)stm.push({x:KT.x-(cols>=120?9:5),y:KT.y-1,a:0,vx:.2,life:2});}
 for(let k=stm.length-1;k>=0;k--){const z=stm[k];z.a+=dt;z.y-=dt*1.6;z.x+=(z.vx+wind*.8)*dt+Math.sin(z.a*3+k)*dt*.5;if(z.a>z.life)stm.splice(k,1);}
 // 고구마
 PT.t+=dt;if(PT.st==='out'&&rnd()<dt*4)stm.push({x:PT.x+1+rnd()*5,y:PT.y-1,a:0,vx:0,life:2});if(PT.st==='gone'&&PT.t>12){PT.st='bury';PT.t=0;}
 // 고양이
 CAT.tw=(CAT.tw||0)-dt;if(rnd()<dt*.25)CAT.tw=.18;CAT.t-=dt;CAT.tail+=dt*(CAT.st==='sleep'?.7:4);CAT.meow=Math.max(0,CAT.meow-dt);if(CAT.st!=='sleep'&&CAT.t<0)CAT.st='sleep';
 if(CAT.st==='sleep'&&rnd()<dt*.7)zz.push({x:CAT.x+(CAT.W||16)-2,y:CAT.y-(CAT.H||5),a:0});
 if(CAT.st==='pet'&&rnd()<dt*2.5)hearts.push({x:CAT.x+(CAT.W||10)/2+(rnd()-.5)*3,y:CAT.y-(CAT.H||6),a:0});
 for(const L_ of [zz,hearts])for(let k=L_.length-1;k>=0;k--){const z=L_[k];z.a+=dt;z.y-=dt*1.2;z.x+=dt*.5;if(z.a>2.2)L_.splice(k,1);}
 // 별똥별
 nextStar-=dt;if(!star&&nextStar<0)shoot();
 if(star){star.a+=dt;star.x+=star.vx*dt;star.y+=star.vy*dt;if(star.a>star.life)star=null;}
 // 마시멜로
 const M=mm,tip=mmTip();if(M.state==='on'){let h=0;for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const c=Math.round(tip.x+dx),r=Math.round(tip.y+dy);if(c>=0&&r>=0&&c<cols&&r<rows)h=Math.max(h,HT[r*cols+c]);}
  M.t+=dt*Math.max(0,h-.12)*.12;if(M.t>1.2&&!M.burn){M.burn=1;SND('crackle');}if(M.burn){M.burn+=dt;if(rnd()<dt*6)embers.push({x:tip.x,y:tip.y-1,vx:(rnd()-.5)*2,vy:-4,a:0,life:1});if(M.burn>9){M.state='new';M.k=0;}}}
 if(M.state==='new'){M.k+=dt;if(M.k>1){M.state='on';M.t=0;M.burn=0;}}
 for(let k=texts.length-1;k>=0;k--){const z=texts[k];z.a+=dt;z.y-=dt*1.2;if(z.a>1.8)texts.splice(k,1);}
}
function shoot(x,y){const d=rnd()<.5?1:-1;star={x:x!==undefined?x:(d>0?cols*(.1+rnd()*.4):cols*(.5+rnd()*.4)),y:y!==undefined?y:1+rnd()*HOR*.35,vx:d*(28+rnd()*18),vy:8+rnd()*5,a:0,life:.9+rnd()*.4};nextStar=12+rnd()*16;}
function startle(x,y){if(Math.abs(x-CAT.x-3)<BW*.8&&CAT.st!=='startle'){CAT.st='startle';CAT.t=1.3;}}
function mmTip(){const L=W>H;return{x:CX+BW*(L?.36:.4),y:BASE-FH*.22,sx:CX+BW*(L?1.1:.78),sy:BASE+3};}

// ---------- 그리기 ----------
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 cv.width=W*dpr|0;cv.height=H*dpr|0;ctx.setTransform(1,0,0,1,0,0);ctx.font='bold 20px '+FONT;
 const k=ctx.measureText('M').width/20||.6;
 cw=Math.max(5.6,Math.min(W>1100?11:9,W>H?(W/150>9?W/150:W/120):W/62));fs=cw/k;chH=fs*1.1;cols=Math.ceil(W/cw);rows=Math.ceil(H/chH);asp=chH/cw;
 fontStr='bold '+fs.toFixed(2)+'px '+FONT;gv.width=Math.ceil(W/4);gv.height=Math.ceil(H/4);
 build();
}
function frame(now){
 const t=now/1000,dt=Math.min(.05,last?t-last:.016);last=t;tN+=dt;fid++;
 acc+=dt;let s=0;while(acc>1/30&&s<3){step(1/30);acc-=1/30;s++;}
 update(dt);
 // 전체 불 세기 → 주변 밝기
 let sum=0;for(let x=Math.max(0,CX-BW);x<Math.min(cols,CX+BW);x++)for(let y=BASE-Math.round(FH*.5);y<BASE;y+=2)sum+=HT[y*cols+x];
 glowK+=(cl(sum/(BW*FH*.35),.3,1.4)*(.88+.12*vn(tN*6,1))-glowK)*Math.min(1,dt*8);
 // 덧그림: 장작·돌·마시멜로·부엉이·반딧불·불티
 for(const g of logs){const st=Math.max(Math.abs(g.x1-g.x0),Math.abs(g.y1-g.y0)*asp)*1.2|0,ch=g.y0===g.y1?'=':(g.x1>g.x0?'/':'\\');
  for(let q=0;q<=st;q++){const x=lerp(g.x0,g.x1,q/st),y=lerp(g.y0,g.y1,q/st),rn=hash(Math.round(x),Math.round(y)+7),em=rn<.28;
   const pul=.5+.5*Math.sin(tN*2.3+rn*30);putN(x,y,em?'o':ch,em?hsl(8+pul*22,100,30+pul*30*glowK):hsl(22,40,14+rn*10));}}
 for(const s_ of stones){const lit=glowK*.9;str(s_.x,s_.y,s_.big?'O':'o',hsl(25,15,16+lit*22));}
 for(const g of falling)str(Math.round(g.x)-3,Math.round(g.y),'[=====]',hsl(25,45,40));
 {const M=mm,T=mmTip(),st=Math.max(Math.abs(T.sx-T.x),Math.abs(T.sy-T.y)*asp)*1.1|0;
  for(let q=2;q<=st;q++){const x=lerp(T.x,T.sx,q/st),y=lerp(T.y,T.sy,q/st);putN(x,y,'\\',hsl(28,45,30+glowK*12));}
  const big=cols>=120,art=big?[' .------. ','|########|','|########|','|########|'," '------' "]:['.--.','|##|',"'--'"],aw=art[0].length,ah=art.length;
  const drawMM=(cx,cy,col,core)=>{const x0=Math.round(cx-aw/2),y0=Math.round(cy-ah/2);art.forEach((ln,j)=>str(x0,y0+j,ln,ch=>ch==='#'?core:col));};
  if(M.state==='on'){const k=M.t,col=M.burn?hsl(20,20,32):k<.35?hsl(40,20,92):k<.7?hsl(40,70,70-((k-.35)*40)):k<1.05?hsl(28,70,48-(k-.7)*40):hsl(20,40,24);
   const core=M.burn?hsl(10,70,(Math.sin(tN*9)>0?30:22)):k<.35?hsl(40,15,80):hsl(42,55,cl(76-k*30,30,80));drawMM(T.x,T.y,col,core);
   if(M.burn){const f=Math.sin(tN*14)>0,top=Math.round(T.y-ah/2)-1;for(let q=0;q<(big?4:2);q++){const fx=Math.round(T.x-aw/2+1+q*(big?2.2:1.5)),a=f!==(q%2===1);putN(fx,top,a?'^':'*',hsl(a?30:48,100,64));if(big)putN(fx,top-1,a?"'":'^',hsl(20,100,56));}}}
  else if(M.k>.3)drawMM(T.sx,T.sy-ah/2,hsl(40,20,90),hsl(40,15,80));}
 if(owl){const o=owl,b=o.blink>0,fade=Math.min(1,o.a,o.life-o.a);if(fade>.2){const c=hsl(30,25,24+glowK*14),e=hsl(50,90,b?20:62);str(o.x,o.y-1,',_,',c);str(o.x-1,o.y,'(',c);putN(o.x,o.y,b?'-':'O',e);putN(o.x+1,o.y,',',c);putN(o.x+2,o.y,b?'-':'O',e);putN(o.x+3,o.y,')',c);str(o.x-1,o.y+1,'(   )',c);str(o.x,o.y+2,'" "',hsl(40,50,40));}}
 const BIG=cols>=120;
 // 텐트 + 랜턴 (도트 스프라이트)
 {const T=TENT,on=T.on,N=BIG?9:6,cx=T.x,b=T.b,fl=.85+.15*Math.sin(tN*9)*Math.sin(tN*5.3);
  // 줄과 말뚝
  for(const sd of [-1,1]){const x0=cx+sd*2,y0=b-N+2,x1=cx+sd*(N+4),y1=b,st=Math.abs(x1-x0);for(let q=1;q<st;q++){const x=lerp(x0,x1,q/st),y=lerp(y0,y1,q/st);if(Math.abs(x-cx)>N-(b-y))putN(x,y,(q%2)?'.':"'",hsl(35,15,30+glowK*10));}putN(x1,y1,'|',hsl(30,30,35));}
  putN(cx,b-N,'|',hsl(30,30,40));putN(cx,b-N-1,'>',hsl(0,70,50+Math.sin(tN*3)*8));
  const pX=cx+Math.round(Math.sin(tN*.25)*(N*.35)),pV=Math.sin(tN*.13)>.2;
  for(let j=0;j<N;j++){const y=b-N+1+j,hw=j+1,dw=Math.max(-1,Math.floor((j-N*.32)*.72));
   for(let x=cx-hw;x<=cx+hw;x++){const d=x-cx;let ch,col;
    if(x===cx-hw){ch='/';col=hsl(25,40,22+glowK*6);}
    else if(x===cx+hw){ch='\\';col=hsl(25,45,36+glowK*12);}
    else if(dw>=0&&Math.abs(d)<=dw){ // 문 안쪽
     if(on){const sil=pV&&j>=N-3&&Math.abs(x-pX)<=(j===N-3?0:1);ch=sil?(j===N-3?'o':'@'):((x+j)%2?':':'.');col=sil?hsl(25,40,14):hsl(44,95,cl((48+(N-j)*2)*fl,30,70));}
     else{ch=' ';col='';}}
    else if(dw>=0&&Math.abs(d)===dw+1){ch=d<0?')':'(';col=hsl(25,45,on?44:22);}
    else{const lit=d>0,wv=Math.sin(tN*1.8-j*.7+x*.25+wind),rip=wv>.75;
     ch=rip?'%':(j%3===2?'=':'#');col=lit?hsl(26,55,(rip?42:34)+glowK*10+(on?4:0)):hsl(22,45,(rip?26:19)+glowK*5);}
    if(ch!==' ')putN(x,y,ch,col);else putN(x,y,' ','');}}
  for(let x=cx-N-1;x<=cx+N+1;x++)putN(x,b+1,x%2?'~':'-',hsl(25,20,10+glowK*4));
  // 랜턴: 기둥 + 고리 + 흔들리는 등 + 나방
  const lx=cx+N+4,top=b-N;for(let y=top;y<=b;y++)putN(lx,y,'|',hsl(30,25,24+glowK*8));putN(lx-1,top,'-',hsl(30,25,30));putN(lx-2,top,'-',hsl(30,25,30));
  const sw=Math.sin(tN*1.6+wind)*0.9,hx=Math.round(lx-2+sw),hy=top+1;putN(hx,hy,'^',hsl(30,20,45));
  putN(hx-1,hy+1,'[',hsl(30,25,45));putN(hx+1,hy+1,']',hsl(30,25,45));putN(hx,hy+1,on?(Math.sin(tN*11)>-.3?'*':'+'):'o',on?hsl(48,100,cl(78*fl,50,90)):hsl(40,10,30));putN(hx,hy+2,'-',hsl(30,25,35));
  T.lx=hx;T.ly=hy+1;T.N=N;
  if(on)for(let k=0;k<2;k++){const a=tN*(2.2+k*.7)+k*3,mx=hx+Math.cos(a)*(3+k),my=hy+1+Math.sin(a*1.3)*1.6;putN(mx,my,((tN*14+k)|0)%2?'v':'^',hsl(40,15,72));}}
 // 주전자 + 컵
 {const sh=KT.shake&&((tN*20)|0)%2?1:0,x=KT.x+sh,y=KT.y,mt=hsl(205,15,40+glowK*14),hot=KT.h>=1?hsl(5,50,50):mt,C_=(ch)=>ch==='/'&&0?mt:hot;
  if(BIG){str(x-4,y-3,'.-o-.',mt);str(x-5,y-2,'/     \\_/',hot);str(x-5,y-1,'|       |',hot);str(x-5,y,"'-------'",mt);KT.sp=[x+4,y-3];}
  else{str(x-1,y-2,'.-.',mt);str(x-2,y-1,'(   )/',hot);str(x-2,y,"'---'",mt);putN(x,y-3,'o',mt);KT.sp=[x+3,y-2];}
  if(KT.cup>0)str(x-(BIG?11:6),y,BIG?'c[__]':'c[_]',(ch,q)=>q===0?hsl(20,40,60):hsl(0,50,50));}
 // 고구마
 {const p=PT;if(p.st==='bury')str(p.x,p.y,BIG?':(@@@):':':(@):',(ch)=>ch==='@'?hsl(300,35,30+glowK*8):ch===':'?hsl(0,0,30):hsl(300,25,28));
  else if(p.st==='out')str(p.x,p.y,BIG?'(####)(####)':'(##)(##)',(ch)=>ch==='#'?hsl(42,95,62):hsl(295,40,42));}
 for(const z of stm)putN(z.x,z.y,z.a<z.life*.5?'~':'.',hsl(0,0,cl(82-z.a/z.life*50,30,90)));
 // 고양이 (선 그림 + 숨쉬기·꼬리·눈 깜빡임)
 {const C=CAT,x=C.x,y=C.y,tl=Math.sin(C.tail),br=Math.sin(tN*1.9)>0,blink=((tN*.37)%1)<.05,tw=C.tw>0;
  const E=C.st==='startle'?'O':C.st==='pet'?'^':blink?'-':'o';
  let m;
  if(BIG){
   if(C.st==='sleep')m=[tw?'            /\\___/-  ':'            /\\___/\\  ',br?'    _..----( -   - ) ':'     _.---( -   - ) ','  .\'        `.  v .\'  ',' (   ((    ))  `--\'\\  ','  `-.__)__)_______.-\' '];
   else m=[tw?'  /-___/\\  ':'  /\\___/\\  ',' ( '+E+'   '+E+' ) ',' (  =v=  ) ',br?'  )     (  ':'  )     (  ',' /  . .  \\ ','(  )   (  )',' ""     "" '];}
  else{
   if(C.st==='sleep')m=[tw?'        /\\_/-':'        /\\_/\\',br?'  _.---( -.- )':'   _.--( -.- )',' (  ((  )`--\'','  `-.)__)__.-\''];
   else m=[tw?' /-_/\\ ':' /\\_/\\ ','( '+E+'.'+E+' )',' > v < ','(")_(")'];}
  const W_=m[0].length,H_=m.length;
  for(let j=0;j<H_;j++){const ln=m[j],a0=ln.search(/\S/),a1=ln.length-1-[...ln].reverse().join('').search(/\S/);if(a0<0)continue;for(let q=a0;q<=a1;q++)putB(x+q,y-H_+1+j,hsl(24,30,cl(5+glowK*2.5+(q/W_)*2,4,10)));}
  for(let j=0;j<H_;j++)for(let q=0;q<W_;q++){let ch=m[j][q];const X=x+q,Y=y-H_+1+j;if(ch===' '){const ln=m[j];if(q>ln.search(/\S/)&&q<ln.trimEnd().length-1&&j>0&&hash(q*5,j*9)<.35)putN(X,Y,C.st==='sleep'&&j>1?'~':'.',hsl(28,50,24+glowK*8));continue;}const lit=glowK*12+(q/W_)*16;let col;
   if(ch==='o'||ch==='O')col=hsl(62,90,60);else if(ch==='^'&&j===1)col=hsl(20,30,20);else if(ch==='v')col=hsl(350,65,68);else if(ch==='='||ch==='"')col=hsl(35,30,70+lit*.4);
   else if(j===0)col=hsl(28,55,44+lit);else col=hsl(28,60,(ch==='_'||ch==='-'?34:42)+lit);
   if(C.st==='sleep'&&j===1&&(ch==='-'))col=hsl(30,45,62);putN(X,Y,ch,col);}
  // 꼬리
  if(C.st==='sleep'){const tx=x-1,ty=y-1;putN(tx,ty,tl>0?'~':'-',hsl(28,60,44));putN(tx-1,ty+(tl>.5?-1:0),tl>0?'-':'~',hsl(28,60,40));}
  else{const tx=x+W_,ty=y-1,sw=tl;putN(tx,ty,'_',hsl(28,60,44));putN(tx+1,ty-1,sw>0?'/':'|',hsl(28,60,44));putN(tx+1+(sw>.3?1:0),ty-2,sw>0?')':'(',hsl(28,60,44));if(BIG)putN(tx+1+(sw>.3?1:0),ty-3,sw>0?'/':'\\',hsl(28,60,44));}
  if(C.st==='startle'){for(let k=0;k<5;k++)putN(x+1+k*(W_-2)/4,y-H_,'^',hsl(28,60,55));putN(x+W_+1,y-H_-1,'!',hsl(0,80,65));}
  if(C.st==='pet'){putN(x-1,y-H_+2,'~',hsl(345,60,70));}
  C.W=W_;C.H=H_;
  if(C.meow>0)str(x+W_+2,y-H_,'meow',hsl(0,0,85));
  for(const z of zz)putN(z.x,z.y,z.a>1.2?'Z':'z',hsl(210,30,80-z.a*15));for(const z of hearts)putN(z.x,z.y,'♥',hsl(345,80,70-z.a*18));}
 // 별똥별
 if(star){const k=star.a/star.life,b=1-k,len=7,sl=star.vy/Math.abs(star.vx);for(let q=0;q<len;q++){const x=star.x-Math.sign(star.vx)*q*1.2,y=star.y-q*1.2*sl;if(y<HOR)putN(x,y,q===0?'*':q<3?(star.vx>0?'\\':'/'):'.',hsl(200,60,cl(95-q*9-k*30,20,95)));}}
 for(const f of flies){const on=Math.sin(tN*2.2+f.ph)>.2;if(on)putN(f.x,f.y,'*',hsl(70,100,62));}
 for(const z of texts)str(Math.round(z.x),Math.round(z.y),z.s,hsl(z.h,90,75));
 // ---- 그리기 ----
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const sg=ctx.createLinearGradient(0,0,0,H);sg.addColorStop(0,'#05061a');sg.addColorStop(HOR/rows,'#1a1d3a');sg.addColorStop(HOR/rows+.001,'#0a0806');sg.addColorStop(1,'#060403');
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
 // 불빛
 if(TENT.on&&TENT.lx){const lx=TENT.lx*cw,ly=TENT.ly*chH,g=ctx.createRadialGradient(lx,ly,0,lx,ly,cw*16);g.addColorStop(0,'rgba(255,210,120,.18)');g.addColorStop(1,'rgba(255,210,120,0)');ctx.fillStyle=g;ctx.fillRect(lx-cw*16,ly-cw*16,cw*32,cw*32);}
 {const fx=(CX+.5)*cw,fy=(BASE-FH*.25)*chH,R=Math.max(W,H)*.75,g=ctx.createRadialGradient(fx,fy,0,fx,fy,R);
  g.addColorStop(0,`rgba(255,120,40,${(.30*glowK).toFixed(3)})`);g.addColorStop(.25,`rgba(255,90,30,${(.12*glowK).toFixed(3)})`);g.addColorStop(1,'rgba(255,80,20,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
 ctx.font=fontStr;ctx.textBaseline='top';
 let lastCol='';const draw=(ch,col,c,r)=>{if(col!==lastCol){ctx.fillStyle=col;lastCol=col;}ctx.fillText(ch,c*cw,r*chH);};
 const R2=(cols*.38)*(cols*.38),fyc=BASE-FH*.2;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c,rn=hash(c*7+3,r*13+5);
  if(OVbs[i]===fid){ctx.fillStyle=OVb[i];ctx.fillRect(c*cw,r*chH,cw+.6,chH+.6);lastCol='';}
  if(OVs[i]===fid){if(OVk[i]!==' ')draw(OVk[i],OVc[i],c,r);continue;}
  if(OVbs[i]===fid)continue;
  const h=r<BASE+1?HT[i]:0,tm=TM[i];
  if(tm){ctx.fillStyle=tm>4&&tm<9?'#020403':'#05080b';ctx.fillRect(c*cw,r*chH,cw+.6,chH+.6);lastCol='';}
  if(h>.1){draw(fireCh(h,rn),fireCol(h),c,r);continue;}
  const dx=c-CX,dy=(r-fyc)*asp,lit=glowK/(1+(dx*dx+dy*dy)/R2*3);
  if(tm){if(tm===9||tm===10){draw('|',hsl(22,30,8+lit*(tm===10?20:10)),c,r);continue;}
   const near=tm>4,v=near?tm-4:tm,ll=near?6+lit*22:5+lit*12;
   if(v===1){if(rn<(near?.5:.3))draw(rn<.2?'^':(rn<.35?'*':'"'),hsl(near?130:150,near?30:25,ll*.8),c,r);}
   else draw(v===2?'/':'\\',hsl(near?120:150,30,ll),c,r);continue;}
  if(r<HOR){const tw=Math.sin(tN*1.5+rn*40);if(rn<.018)draw(rn<.006?'*':'.',hsl(220,30,55+tw*25),c,r);continue;}
  // 땅
  if(rn<.34)draw(rn<.08?'"':rn<.18?',':'.',hsl(rn<.08?90:30,rn<.08?35:20,4+lit*24+(r-HOR)*.15),c,r);
 }
 // 연기
 for(const s_ of smoke){const a=s_.a/s_.life,c=Math.round(s_.x),r=Math.round(s_.y);if(r<0||c<0||c>=cols)continue;draw(a<.3?'~':a<.6?'~':'.',hsl(25,8,cl(30-a*24,4,40)),c,r);if(a<.6&&c+1<cols)draw('~',hsl(25,6,20-a*14),c+1,r);}
 // 불티
 for(const e of embers){const k=e.a/e.life,tw=Math.sin(e.a*25+e.x)>-.5;if(!tw)continue;draw(k<.4?'*':'.',hsl(30+k*10,100,cl(78-k*45,20,85)),Math.round(e.x),Math.round(e.y));}
 gx.clearRect(0,0,gv.width,gv.height);gx.drawImage(cv,0,0,gv.width,gv.height);
 requestAnimationFrame(frame);
}

// ---------- 터치 ----------
let held=false,touched=false,px0=0,py0=0,downT=0,moved=false,lp=false,onProp=false,lastSw=0;
function tap(x,y){const c=x/cw,r=y/chH,T=mmTip();
 if(c>CAT.x-1&&c<CAT.x+(CAT.W||16)+1&&r>CAT.y-(CAT.H||5)-1&&r<CAT.y+1.5){CAT.st='sit';CAT.t=4;CAT.meow=1.3;SND('meow');return true;}
 if(Math.abs(c-KT.x)<(cols>=120?6:4)&&r>KT.y-5&&r<KT.y+1.5){if(KT.h>.5){KT.cup=12;KT.h=.3;KT.wt=0;SND('splash',{min:200});texts.push({x:KT.x-6,y:KT.y-3,s:'pour~',h:200,a:0});}else{texts.push({x:KT.x-2,y:KT.y-4,s:'...',h:200,a:0});SND('tick');}return true;}
 if(Math.abs(c-PT.x-(cols>=120?5:3))<(cols>=120?7:4.5)&&Math.abs(r-PT.y)<2){if(PT.st==='bury'){PT.st='out';PT.t=0;SND('crackle',{min:100});burst(PT.x+2,PT.y-1,8,4);}else if(PT.st==='out'){PT.st='gone';PT.t=0;texts.push({x:PT.x,y:PT.y-2,s:'yum!',h:45,a:0});SND('gulp');setTimeout(()=>SND('gulp'),150);}return true;}
 if(Math.abs(c-TENT.x-2)<(TENT.N||6)+6&&r>TENT.b-(TENT.N||6)-3&&r<=TENT.b+1.5){TENT.on=!TENT.on;SND('tick');return true;}
 if(star&&Math.hypot(c-star.x,(r-star.y)*asp)<8){texts.push({x:star.x-2,y:star.y+1,s:'wish!',h:200,a:0});for(let q=0;q<5;q++)setTimeout(()=>SND('chime',{f:[1047,1319,1568,2093,1568][q],min:0}),q*90);star.life=star.a+.15;return true;}
 if(r<HOR-3&&Math.abs(c-CX)>BW*.3){shoot(c,r);SND('chime',{f:1568,min:200});return true;}
 if(mm.state==='on'&&Math.abs(c-T.x)<(cols>=120?7:3.5)&&Math.abs(r-T.y)<(cols>=120?4:2.5)){const k=mm.t;
  if(mm.burn){texts.push({x:T.x-1,y:T.y-2,s:'puff',h:0,a:0});SND('whoosh',{v:.3});for(let q=0;q<6;q++)smoke.push({x:T.x+(rnd()-.5)*2,y:T.y-1,a:0,life:2});}
  else if(k<.3){texts.push({x:T.x-2,y:T.y-2,s:'raw..',h:200,a:0});SND('tick');return true;}
  else{texts.push({x:T.x-2,y:T.y-2,s:k<1?'yum!':'crunch',h:k<1?45:20,a:0});SND('gulp');setTimeout(()=>SND('gulp'),150);}
  mm.state='new';mm.k=0;return true;}
 if(owl&&Math.abs(c-owl.x-1)<3&&Math.abs(r-owl.y)<2.5){owl.blink=.3;texts.push({x:owl.x+4,y:owl.y-1,s:'hoo',h:40,a:0});SND('hoot');return true;}
 if(Math.abs(c-CX)<BW*.6&&r>BASE-FH*1.1&&r<BASE+2){burst(c,Math.min(r,BASE-2),18,8);inject(c,Math.min(r,BASE-2),3,.5);SND('crackle',{min:150});return true;}
 return false;}
addEventListener('pointerdown',e=>{held=true;moved=false;lp=false;px0=e.clientX;py0=e.clientY;downT=tN;onProp=tap(e.clientX,e.clientY);if(!touched){touched=true;hint.style.opacity=0;}});
addEventListener('pointermove',e=>{if(!held)return;const x=e.clientX,y=e.clientY,dx=(x-px0)/cw;if(!moved&&Math.hypot(x-px0,y-py0)>10)moved=true;
 if(moved){const cc_=x/cw,rr_=y/chH;if(cc_>CAT.x-1&&cc_<CAT.x+(CAT.W||16)+1&&rr_>CAT.y-(CAT.H||5)-1&&rr_<CAT.y+1.5){CAT.st='pet';CAT.t=1.8;SND('purr',{min:1700});px0=x;py0=y;return;}
  wind=cl(wind+dx*.05,-3,3);for(const em of embers){if(Math.abs(em.x-x/cw)<12&&Math.abs(em.y-y/chH)<8)em.vx+=dx*.8;}
  if(tN-lastSw>.3&&Math.abs(dx)>.5){lastSw=tN;SND('wind',{v:Math.min(1,Math.abs(dx)*.15)});}px0=x;py0=y;}});
addEventListener('pointerup',()=>{held=false;});
addEventListener('pointercancel',()=>{held=false;});
addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(held&&!moved&&!lp&&tN-downT>.5){lp=true;falling.push({x:CX+(rnd()-.5)*BW*.2,y:BASE-FH*1.05,vy:0});SND('whoosh',{v:.2});}},60);
window._fire={kt:()=>KT,cat:()=>CAT,pt:()=>PT,shoot:()=>shoot(),add:()=>falling.push({x:CX,y:BASE-FH,vy:0}),mm:()=>mm,owl:()=>{nextOwl=0;},wind:v=>wind=v};
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
</script>
<script>/* 모바일 터치: 브라우저가 스크롤·확대 동작으로 가로채지 않게 */(()=>{const s=e=>{if(e.cancelable)e.preventDefault();};for(const t of ["touchstart","touchmove"])document.addEventListener(t,s,{passive:false});document.addEventListener("gesturestart",s,{passive:false});document.addEventListener("dblclick",s,{passive:false});})();</script>
