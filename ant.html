<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>글자 개미굴</title>
<style>
html,body{margin:0;height:100%;background:#0d0805;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#g{filter:blur(8px) saturate(1.4);opacity:.6;mix-blend-mode:screen;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));text-align:center;color:#fff;font:600 14px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;letter-spacing:.03em;text-shadow:0 1px 10px #000,0 0 3px #000;transition:opacity 1.4s;pointer-events:none;opacity:.9}
#hint small{display:block;font-weight:500;opacity:.75;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div id="hint">톡 · 꾸욱 · 쓱<small>땅 위에 먹이 · 꾹 눌러 길 막기 · 쓸어서 굴 파기</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const gv=document.getElementById('g'),gx=gv.getContext('2d');
const hint=document.getElementById('hint');
const FONT='"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace';
let W,H,dpr,cols,rows,cw,chH,fs,asp,n,fontStr,S,E;
let TUN,OBS,OBK,OBC,RN,V,FR,NEWT,RID,PH,WT,SUMP,GRS,WX,OVk,OVc,OVs,HL;
const INF=30000;

function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vn(x,y)*.55+vn(x*2.1+5,y*2.1+3)*.3+vn(x*4.3+11,y*4.3+7)*.15;}
const cl=(v,a,b)=>v<a?a:v>b?b:v;
const cc=new Map();
function hsl(h,s,l){h=((h%360)+360)%360;h=(h/4|0)*4;s=cl(s,0,100);s=(s/5|0)*5;l=cl(l,0,100);l=(l/2|0)*2;
 const k=h*1000000+s*1000+l;let v=cc.get(k);if(!v){v='hsl('+h+','+s+'%,'+l+'%)';cc.set(k,v);}return v;}
const rnd=Math.random;
const SND=(n,o)=>{try{if(parent!==window&&parent.SFX)parent.SFX.play(n,o);}catch(e){}},SNDSET=(k,v)=>{try{if(parent!==window&&parent.SFX)parent.SFX.set(k,v);}catch(e){}};
let tN=0,last=0,fid=0,NT=0;
try{const m=location.hash.match(/^#t(\d+)$/);if(m)tN=+m[1];}catch(e){}

// ---------- world ----------
const FOOD=0,NURSE=1,QUEEN=2,TRASH=3,FARM=4,RANCH=5,SLEEP=6,SUMPR=7,BASE_ROOMS=8;
let rooms=[],fields={},dirty=true,sfood=[],tfood=[],ants=[],foes=[],queen=null,jobs=[],expands=[],worm=null,mole=null,nextMole=30,dirtT=[],parts=[],nextDrop=8;
let grubs=[],bug=null,snail=null,bird=null,nextBird=25,SL=null,rain=null,big=null,nextEvent=35,evIdx=0,nextFlight=70,guardI=0,aphids=[],mush=[],flood=0,foeT=0,watT=0,wTick=0;
const idx=(c,r)=>r*cols+c;
const inb=(c,r)=>c>=0&&r>=0&&c<cols&&r<rows;
function walk(i){const r=(i/cols)|0;return TUN[i]===1||r===S-1;}
function carve(c,r,t){if(!inb(c,r)||r<S)return false;const i=idx(c,r);if(TUN[i]||OBS[i])return false;TUN[i]=1;if(t!==undefined)NEWT[i]=t;dirty=true;return true;}
function carveLine(c0,r0,c1,r1){const st=Math.max(Math.abs(c1-c0),Math.abs(r1-r0)*2,1);
 for(let k=0;k<=st;k++){const c=Math.round(c0+(c1-c0)*k/st),r=Math.round(r0+(r1-r0)*k/st);carve(c,r);if(Math.abs(r1-r0)*asp>Math.abs(c1-c0))carve(c+1,r);}}
function carvePath(pts){for(let k=0;k<pts.length-1;k++)carveLine(pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1]);}
function carveRoom(k,cx,cy,rx,ry){for(let r=Math.floor(cy-ry-1);r<=cy+ry+1;r++)for(let c=Math.floor(cx-rx-1);c<=cx+rx+1;c++){
 const dx=(c-cx)/rx,dy=(r-cy)/ry,d=dx*dx+dy*dy*(dy>0?1.4:1);if(d<1+.15*(hash(c,r)-.5)&&inb(c,r)&&r>S+1){carve(c,r);RID[idx(c,r)]=k;}}}
function floorOf(k){const out=[];for(let i=0;i<n;i++)if(RID[i]===k&&TUN[i]&&i+cols<n&&!TUN[i+cols])out.push(i);out.sort((a,b)=>(a%cols)-(b%cols));return out;}
function setObs(c,r,ch,col,kind){if(!inb(c,r)||r<=S)return;const i=idx(c,r);if(TUN[i])return;OBS[i]=kind;OBK[i]=ch;OBC[i]=col;}

function build(){
 n=cols*rows;S=Math.round(rows*.15);E=Math.round(cols*.56);
 TUN=new Uint8Array(n);OBS=new Uint8Array(n);OBK=new Array(n);OBC=new Array(n);RN=new Float32Array(n);V=new Float32Array(n);FR=new Float32Array(n);NEWT=new Float32Array(n).fill(-1);
 RID=new Int8Array(n).fill(-1);PH=new Float32Array(n);WT=new Float32Array(n);SUMP=new Uint8Array(n);GRS=new Int8Array(cols);WX=new Float32Array(cols);
 OVk=new Array(n);OVc=new Array(n);OVs=new Int32Array(n);HL=new Int32Array(n);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=idx(c,r);RN[i]=hash(c*7+3,r*13+5);V[i]=fbm(c*.18,r*.3);}
 for(let c=0;c<cols;c++)GRS[c]=hash(c,77)<.18?0:1+(hash(c,91)*3|0);
 const C=f=>Math.round(cols*f),R=f=>Math.round(rows*f),rx=Math.max(5,C(.085));
 rooms=[{name:'food',cx:C(.2),cy:R(.32),rx:rx+1,ry:2.5,store:12,ev:0},
        {name:'nurse',cx:C(.8),cy:R(.5),rx,ry:2.4,eggs:4,larva:3,fed:0},
        {name:'queen',cx:C(.52),cy:R(.8),rx:rx+3,ry:3},
        {name:'trash',cx:C(.18),cy:R(.71),rx:Math.max(4,rx-2),ry:2,trash:6},
        {name:'farm',cx:C(.8),cy:R(.29),rx,ry:2.4,mulch:6},
        {name:'ranch',cx:C(.15),cy:R(.5),rx:rx-1,ry:2.3},
        {name:'sleep',cx:C(.46),cy:R(.6),rx:rx-1,ry:2},
        {name:'sump',cx:C(.84),cy:R(.88),rx:rx-1,ry:2.2}];
 rooms.forEach((m,k)=>carveRoom(k,m.cx,m.cy,m.rx,m.ry));
 const P=(a,b)=>[C(a),R(b)];
 carvePath([[E,S],[E,S+3],P(.54,.2),P(.5,.25)]);
 carvePath([P(.5,.25),P(.36,.27),[C(.2)+rx,R(.32)]]);
 carvePath([P(.5,.25),P(.64,.25),[C(.8)-rx,R(.29)]]);
 carvePath([P(.5,.25),P(.49,.34),P(.48,.42)]);
 carvePath([P(.48,.42),P(.3,.46),[C(.15)+rx-1,R(.5)]]);
 carvePath([P(.48,.42),P(.66,.46),[C(.8)-rx,R(.5)]]);
 carvePath([P(.48,.42),P(.46,.5),P(.46,.58)]);
 carvePath([P(.46,.6),P(.42,.66),P(.4,.68)]);
 carvePath([P(.4,.68),P(.3,.7),[C(.18)+3,R(.71)]]);
 carvePath([P(.4,.68),P(.46,.74),P(.5,.78)]);
 carvePath([[C(.52)+rx+2,R(.8)+1],P(.7,.85),[C(.84)-rx+1,R(.88)]]);
 carvePath([[C(.8)+2,R(.5)+2],P(.88,.6),P(.74,.7),P(.66,.77)]);
 carvePath([[C(.8)+rx-1,R(.29)],P(.9,.38),[C(.8)+3,R(.5)-2]]);
 // treasures (unbreakable)
 const fos=["   _.-''''-.____","  (  o   .--.  __>"," `'-.\\/\\/\\/\\/-'`"];
 const fc=C(.06),fr=R(.9);fos.forEach((ln,k)=>{for(let q=0;q<ln.length;q++)if(ln[q]!==' ')setObs(fc+q,fr+k,ln[q],hsl(44,22,70),1);});
 "o==o".split('').forEach((ch,q)=>setObs(C(.34)+q,R(.6),ch,hsl(44,22,66),1));
 ['(','$',')'].forEach((ch,q)=>setObs(C(.66)+q,R(.66),ch,hsl(48,90,60),2));
 {let c=0,r=S+1;for(let k=0;k<R(.3);k++){setObs(c,r,k%3===2?'|':'\\',hsl(32,38,40),3);setObs(c+1,r,'\\',hsl(32,38,34),3);if(k%5===3)setObs(c+2,r,'_',hsl(32,38,40),3);r++;if(k%2)c++;if(c>C(.06))c--;}}
 for(let c=0;c<cols;c++)for(let r=rows-2;r<rows;r++)setObs(c,r,'~',hsl(200,70,50),4);
 for(let i=0;i<n;i++){NEWT[i]=-1;if(RID[i]===SUMPR){SUMP[i]=1;const r=(i/cols)|0;if(r>=rooms[SUMPR].cy)WT[i]=1;}}
 rooms.forEach((m,k)=>m.floor=floorOf(k));
 guardI=idx(C(.5),R(.25));
 dirty=true;recompute();
 sfood=[];tfood=[];jobs=[];expands=[];parts=[];dirtT=[];foes=[];rain=null;big=null;
 queen={eggs:2,t:3,a:0};
 aphids=[];const rf=rooms[RANCH].floor;for(let k=0;k<6;k++)aphids.push({i:rf[(k*3+1)%rf.length],ph:rnd()*9,o:0});
 mush=[];const ff=rooms[FARM].floor;for(let k=0;k<ff.length;k+=3)mush.push({i:ff[k],g:rnd()});
 ants=[];
 const roles=[];const add=(r,k)=>{for(let q=0;q<k;q++)roles.push(r);};
 add('forage',12);add('nurse',7);add('clean',2);add('leaf',3);add('ranch',2);add('soldier',5);add('wing',4);add('idle',9);
 roles.forEach(ro=>spawnAnt(ro));
 worm={pts:[],c:cols*.3,r:rows*.55,h:rnd()*6,sp:2.2};
 grubs=[];for(let k=0;k<3;k++){for(let t=0;t<200;t++){const c=2+(rnd()*(cols-4)|0),r=S+6+(rnd()*(rows-S-12)|0);let ok=true;for(let y=-2;y<=2;y++)for(let x=-3;x<=3;x++){if(!inb(c+x,r+y)||TUN[idx(c+x,r+y)]||OBS[idx(c+x,r+y)])ok=false;}if(ok){grubs.push({c,r,ph:rnd()*9,s:0});break;}}}
 SL=new Float32Array(cols);bug={x:cols*.2,d:1,st:'walk',t:0,y:S-1,cl:0};snail={x:cols*.75,d:-1,hide:0};bird=null;nextBird=tN+20;
 mole=null;nextMole=tN+28;nextEvent=tN+30;nextFlight=tN+60;
}
function randTun(room){const list=[];for(let k=0;k<n;k++)if(TUN[k]&&((k/cols)|0)>S+1&&(room===undefined||RID[k]===room)&&!SUMP[k])list.push(k);return list[(rnd()*list.length)|0];}
function spawnAnt(role,at){
 const i=at!==undefined?at:randTun(role==='wing'?QUEEN:undefined);
 const a={c:i%cols,r:(i/cols)|0,t:1,spd:5+rnd()*2.5,role,st:null,carry:null,alarm:0,pause:0,fl:rnd()*9,dc:1,dr:0,rest:0,gcd:2+rnd()*3,hp:role==='soldier'?8:4,biting:0};
 a.pc=a.c;a.pr=a.r;resetTask(a);ants.push(a);return a;}

function bfs(src){const D=new Int16Array(n).fill(INF),q=new Int32Array(n);let h=0,t=0;
 for(const i of src)if(i>=0&&i<n&&walk(i)&&D[i]!==0){D[i]=0;q[t++]=i;}
 while(h<t){const i=q[h++],c=i%cols,d=D[i]+1;
  const nb=[c>0?i-1:-1,c<cols-1?i+1:-1,i-cols,i+cols];
  for(const j of nb){if(j<0||j>=n)continue;if(D[j]<=d||!walk(j))continue;D[j]=d;q[t++]=j;}}
 return D;}
function recompute(){
 if(!dirty)return;dirty=false;
 fields.ent=bfs([idx(E,S-1),idx(E+1,S-1)]);
 rooms.forEach((m,k)=>{m.floor=floorOf(k);fields['r'+k]=bfs(m.floor.length?m.floor:[idx(Math.round(m.cx),Math.round(m.cy))]);});
 fields.sfood=bfs(sfood.map(f=>idx(f.c,S-1)));
 fields.tfood=bfs(tfood.map(f=>f.i));
 const nw=[];for(let i=0;i<n;i++)if(NEWT[i]>=0&&TUN[i])nw.push(i);fields.new=bfs(nw);
 fields.guard=bfs([guardI]);
 fields.big=big?bfs(bigCells()):bfs([]);
 fields.foe=bfs(foes.map(f=>idx(f.c,f.r)));
 updWaterField();
 jobs.forEach(j=>{if(j.ant)j.F=bfs([idx(j.c,j.r)]);});
}
function updWaterField(){const src=[];for(let i=0;i<n;i++)if(WT[i]>.35&&TUN[i]&&!SUMP[i])src.push(i);fields.water=bfs(src);}
function bigCells(){const out=[];for(let q=-1;q<=big.len;q++){const c=Math.round(big.c)+q;if(c>=0&&c<cols)out.push(idx(c,S-1));}return out;}

// ---------- ant brains ----------
function resetTask(a){a.tgt=null;a.st=null;a.job=null;
 switch(a.role){
  case 'forage':a.st='toEnt';a.tgt='ent';break;
  case 'nurse':a.st='getFood';a.tgt='r0';break;
  case 'clean':a.st='getTrash';a.tgt='r0';break;
  case 'leaf':a.st='toEnt';a.tgt='ent';break;
  case 'ranch':a.st='toRanch';a.tgt='r'+RANCH;break;
  case 'soldier':a.st='guard';a.tgt='guard';break;
  case 'wing':a.st='settle';a.tgt='r'+QUEEN;break;
  case 'haul':a.st='getFood';a.tgt='r0';break;
  default:a.st='wander';a.wt=3+rnd()*6;
 }
}
function arrive(a){
 const m0=rooms[FOOD];
 switch(a.st){
  case 'toEnt':
   if(rain){a.st='home';a.tgt='r0';break;}
   if(a.role==='leaf'){a.st='leafCut';a.tgt=null;a.wt=3+rnd()*5;a.dc=rnd()<.5?1:-1;break;}
   if(big&&big.car.length<big.need+2){a.st='toBig';a.tgt='big';break;}
   if(sfood.length){a.st='toSF';a.tgt='sfood';}else{a.st='scout';a.tgt=null;a.wt=5+rnd()*8;a.dc=rnd()<.5?1:-1;}break;
  case 'toSF':{const f=sfood.find(f=>Math.abs(f.c-a.c)<=1);if(f){f.amt--;a.carry={ch:f.ch,col:f.col};if(f.amt<=0){sfood.splice(sfood.indexOf(f),1);dirty=true;}a.st='home';a.tgt='r0';}
   else{a.st=sfood.length?'toSF':'scout';a.tgt=sfood.length?'sfood':null;a.wt=4;}break;}
  case 'toBig':if(big&&big.car.length<big.need+2){big.car.push(a);a.st='haulBig';a.bo=big.car.length-1;}else{resetTask(a);}break;
  case 'home':if(a.carry){if(a.carry.ch!=='~'){m0.store=Math.min(m0.store+1,m0.floor.length*2);recruit();}a.carry=null;}
   a.rest=.6+rnd();if(a.role==='forage'||a.role==='leaf'){a.st='toEnt';a.tgt='ent';if(!sfood.length&&rnd()<.5)a.rest=3+rnd()*4;}else resetTask(a);break;
  case 'getTF':{const k=tfood.findIndex(f=>Math.abs(f.i%cols-a.c)<=1&&Math.abs(((f.i/cols)|0)-a.r)<=1);if(k>=0){a.carry={ch:tfood[k].ch,col:tfood[k].col};tfood.splice(k,1);dirty=true;a.st='home';a.tgt='r0';}else resetTask(a);break;}
  case 'getFood':
   if(a.role==='nurse'&&mush.some(m=>m.g>.8)&&rnd()<.4){a.st='getMush';a.tgt='r'+FARM;break;}
   if(m0.store>2){m0.store--;a.carry={ch:',',col:hsl(42,70,62)};
    if(a.role==='haul'&&a.room){a.st='toRoom';a.tgt='r'+a.room;}else{a.st='feed';a.tgt='r'+NURSE;}}
   else{a.rest=2;}break;
  case 'getMush':{const m=mush.find(m=>m.g>.8);if(m){m.g=.1;a.carry={ch:'T',col:hsl(40,30,88)};a.st='feed';a.tgt='r'+NURSE;}else{a.st='getFood';a.tgt='r0';}break;}
  case 'feed':{a.carry=null;const nr=rooms[NURSE];nr.fed++;if(nr.fed>=3&&nr.larva>0){nr.fed=0;nr.larva--;if(ants.length<64){const b=spawnAnt(rnd()<.12?'soldier':rnd()<.6?'forage':'idle',nr.floor[(rnd()*nr.floor.length)|0]);spark(b.c,b.r-1,'+',hsl(50,90,80),.8);}}
   a.st='getEgg';a.tgt='r'+QUEEN;break;}
  case 'getEgg':if(queen.eggs>0){queen.eggs--;a.carry={ch:'o',col:hsl(48,40,92)};a.st='bringEgg';a.tgt='r'+NURSE;}else{a.st='getFood';a.tgt='r0';a.rest=1;}break;
  case 'bringEgg':a.carry=null;rooms[NURSE].eggs=Math.min(rooms[NURSE].eggs+1,rooms[NURSE].floor.length);a.st='getFood';a.tgt='r0';break;
  case 'getTrash':a.carry={ch:'%',col:hsl(30,15,50)};a.st='dump';a.tgt='r'+TRASH;break;
  case 'dump':a.carry=null;rooms[TRASH].trash=Math.min(rooms[TRASH].trash+1,rooms[TRASH].floor.length*2);a.st='getTrash';a.tgt='r0';a.rest=4+rnd()*6;break;
  case 'toFarm':a.carry=null;rooms[FARM].mulch=Math.min(rooms[FARM].mulch+1,rooms[FARM].floor.length);mush.forEach(m=>m.g=Math.min(1,m.g+.15));a.st='toEnt';a.tgt='ent';a.rest=1;break;
  case 'toRanch':{a.rest=1.2+rnd();const ap=aphids[(rnd()*aphids.length)|0];if(ap)ap.o=1;a.carry={ch:'.',col:hsl(50,95,65)};a.st='home';a.tgt='r0';break;}
  case 'toRoom':{a.carry=null;const m=rooms[a.room];if(m)m.store=(m.store||0)+1;if(m&&m.store>=Math.max(3,m.floor.length*1.5)){a.role='idle';}a.st='getFood';a.tgt='r0';break;}
  case 'explore':{for(let dr=-2;dr<=2;dr++)for(let dc=-3;dc<=3;dc++)if(inb(a.c+dc,a.r+dr))NEWT[idx(a.c+dc,a.r+dr)]=-1;dirty=true;
   let nb=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>{if(inb(a.c+x,a.r+y)&&TUN[idx(a.c+x,a.r+y)])nb++;});
   const far=rooms.every(m=>Math.hypot((m.cx-a.c),(m.cy-a.r)*asp)>m.rx+8);
   if(nb<=2&&far&&rooms.length<14&&rnd()<.65&&a.r>S+3)expands.push({c:a.c,r:a.r,p:0,rx:3+rnd()*2,ry:1.6+rnd()*.6});
   a.st='wander';a.tgt=null;a.wt=2;break;}
  case 'guard':a.st='patrol';a.tgt=null;a.wt=3+rnd()*4;break;
  case 'settle':a.st='wander';a.tgt=null;a.wt=4+rnd()*6;a.rest=1+rnd()*3;break;
  case 'sleepGo':a.st='sleeping';a.rest=6+rnd()*8;break;
  case 'flyOut':{SND('buzz',{min:400});const i=ants.indexOf(a);if(i>=0)ants.splice(i,1);parts.push({k:'fly',x:a.c,y:a.r-1,a:0,ph:rnd()*9,vx:(rnd()-.5)*4});break;}
  case 'evGet':{const nr=rooms[NURSE];if(nr.eggs>0){nr.eggs--;a.carry={ch:'o',col:hsl(48,40,92)};a.st='evPut';a.tgt='r0';}else if(nr.larva>0){nr.larva--;a.carry={ch:'c',col:hsl(45,45,80)};a.st='evPut';a.tgt='r0';}else{a.st='wander';a.wt=3;}break;}
  case 'evPut':a.carry=null;m0.ev++;a.st='evGet';a.tgt='r'+NURSE;break;
  case 'retGet':if(m0.ev>0){m0.ev--;a.carry={ch:'o',col:hsl(48,40,92)};a.st='retPut';a.tgt='r'+NURSE;}else resetTask(a);break;
  case 'retPut':{a.carry=null;const nr=rooms[NURSE];if(nr.eggs<nr.floor.length*.6)nr.eggs++;else nr.larva++;a.st='retGet';a.tgt='r0';break;}
  case 'bailGet':{for(let dr=-1;dr<=1;dr++)for(let dc=-2;dc<=2;dc++){if(!inb(a.c+dc,a.r+dr))continue;const i=idx(a.c+dc,a.r+dr);if(SUMP[i])continue;WT[i]*=.35;}
   a.carry={ch:'~',col:hsl(200,80,62)};a.st='bailOut';a.tgt='ent';break;}

function recruit(){let k=0;for(const b of ants){if(k>=2)break;if(b.role==='idle'&&b.st==='wander'&&rnd()<.6){b.role='forage';resetTask(b);k++;}}}
function choose(a){
 const i=idx(a.c,a.r),opts=[];
 [[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>{const c=a.c+x,r=a.r+y;if(inb(c,r)&&walk(idx(c,r)))opts.push([c,r,x,y]);});
 if(!opts.length)return null;
 if(a.alarm>.25&&a.st!=='fight')return opts[(rnd()*opts.length)|0];
 const back=o=>o[0]===a.pc&&o[1]===a.pr;
 let F=null;
 if(a.st==='job'&&a.job&&a.job.F)F=a.job.F;else if(a.tgt)F=fields[a.tgt];
 if(F&&F[i]<INF){
  if(F[i]===0)return 'arrive';
  const better=opts.filter(o=>F[idx(o[0],o[1])]<F[i]);
  if(better.length&&rnd()>.04){better.sort((p,q)=>PH[idx(q[0],q[1])]-PH[idx(p[0],p[1])]+(rnd()-.5)*.3);return better[0];}
 }

 if(a.st==='scout'||a.st==='leafCut'){const same=pool.filter(o=>o[2]===a.dc&&o[3]===0);if(same.length&&rnd()<.9)return same[0];}
 const keep=pool.filter(o=>o[2]===a.dc&&o[3]===a.dr);if(keep.length&&rnd()<.6)return keep[0];
 return pool[(rnd()*pool.length)|0];
}
function updAnts(dt){

function stepWater(){

 for(let k=expands.length-1;k>=0;k--){const x=expands[k];x.p+=dt*.5;

   if(r<S){
    const h=GRS[c],tl=wind+WX[c]+Math.sin(tN*2+c*.4)*.2;
    if(h>0&&r>=S-h){const lean=tl+(r===S-h?.4*Math.sign(tl):0);draw(lean>.55?'/':lean<-.55?'\\':'|',hsl(95+rn*25,55,(r===S-h?44:34)*(1-dk*.6)),c,r);continue;}
    if(r===S-1&&hash(c,5)<.05){draw(hash(c,6)<.5?'*':'@',hsl(hash(c,7)<.5?350:50,80,62*(1-dk*.5)),c,r);continue;}
    if(c>=E-3&&c<=E+4&&r===S-1&&!(c===E||c===E+1)){draw(c<E?'/':c>E+1?'\\':'_',hsl(32,45,50*(1-dk*.5)),c,r);continue;}
    if(NT>.3&&!rain&&r<S-4&&rn<.02){draw(rn<.006?'*':'.',hsl(55,40,60+Math.sin(tN*3+rn*900)*25),c,r);continue;}
    if((NT<.6||rd>0)&&r<S-4){const cld=fbm(c*.07-tN*.03,r*.25)-.68+rd*.45;if(cld>0){draw(cld>.12?'O':cld>.06?'o':'.',rd>.2?'hsla(220,10%,55%,.9)':`hsla(0,0%,100%,${((1-NT)*.85).toFixed(2)})`,c,r);continue;}}
    continue;}
   if(TUN[i]){
    const w=WT[i];
    if(w>.12){draw(w>.75?'=':w>.4?'~':'-',hsl(200,70,32+w*28+Math.sin(tN*3+c)*4),c,r);continue;}
    if(PH[i]>.15)draw('.',hsl(80,50,20+PH[i]*25),c,r);
    else if(NEWT[i]>=0)draw('.',hsl(40,40,24),c,r);
    continue;}
   if(HL[i]===fid)continue;
   if(OBS[i]){let col=OBC[i],ch=OBK[i];
    if(OBS[i]===4){ch=((c+(tN*4|0))%4)?'~':'-';col=hsl(200,70,40+Math.sin(tN*2+c*.5)*8);}
    else if(OBS[i]===2&&Math.sin(tN*2.5)>.92)col=hsl(50,100,85);
    draw(ch,col,c,r);continue;}
   if(r===S){draw(['_','.',',','_'][(rn*4)|0],hsl(80-rn*40,40,38*(1-dk*.4)),c,r);continue;}
   let ch,col;const v=V[i];
   if(r<S+5&&hash(c,3)<.12&&GRS[c]>1){ch=rn<.5?'|':rn<.75?'/':'\\';col=hsl(38,35,34-dep*20);}
   else if(v>.74&&rn<.5){ch=rn<.25?'@':'O';col=hsl(30,8,34+v*10-dep*8);}
   else{const q=cl(v*1.25+rn*.35-.2,0,.99);ch=[':',';','=','+','%','#','8'][(q*7)|0];const ed=(c>0&&TUN[i-1])||(c<cols-1&&TUN[i+1])||TUN[i-cols]||(i+cols<n&&TUN[i+cols]);
    const wet=rd>0&&r<S+4?6:0;col=hsl(24+v*14,ed?45:34,(ed?27:17)+q*(ed?12:9)-dep*6-wet);}
   if(FR[i]>0){col=hsl(32,45,24+FR[i]*30);ch=rn<.5?'#':'%';}
   draw(ch,col,c,r);
  }
 }
 for(const d of dirtT){const a=1-(tN-d.t)/5;if(a>0&&inb(d.c,d.r)&&!TUN[idx(d.c,d.r)]&&!OBS[idx(d.c,d.r)])draw(':',hsl(30,40,22+a*24),d.c,d.r);}
 if(NT>.3&&!rain){ctx.fillStyle=`rgba(230,235,255,${(NT*.9).toFixed(2)})`;ctx.font='bold '+(fs*1.6).toFixed(1)+'px '+FONT;ctx.fillText('(',W*.15,chH*1.5);}
 gx.clearRect(0,0,gv.width,gv.height);gx.drawImage(cv,0,0,gv.width,gv.height);
 requestAnimationFrame(frame);
}

// ---------- touch ----------
let held=false,touched=false,px0=0,py0=0,downT=0,moved0=false,blocked=false,heldSurf=false,lastFood=0,lastC=-1,lastR=-1,lastP=null;
function cellAt(x,y){return[Math.floor(x/cw),Math.floor(y/chH)];}
function doBlock(){blocked=true;const [c0,r0]=cellAt(px0,py0);if(r0<=S+1)return;SND('thud');
 for(let r=r0-2;r<=r0+2;r++)for(let c=c0-3;c<=c0+3;c++){if(!inb(c,r)||r<=S+1)continue;const dx=(c-c0)/3.2,dy=(r-r0)/2;if(dx*dx+dy*dy<=1){const i=idx(c,r);if(TUN[i]&&!SUMP[i]){TUN[i]=0;FR[i]=1;NEWT[i]=-1;PH[i]=0;WT[i]=0;}}}
 dirty=true;recompute();
 for(const a of ants){if(!walk(idx(a.c,a.r))){let best=null,bd=1e9;for(let r=a.r-4;r<=a.r+4;r++)for(let c=a.c-6;c<=a.c+6;c++){if(inb(c,r)&&walk(idx(c,r))){const d=Math.abs(c-a.c)+Math.abs(r-a.r);if(d<bd){bd=d;best=[c,r];}}}
   if(best){a.c=a.pc=best[0];a.r=a.pr=best[1];a.t=1;}}
  if(Math.abs(a.c-c0)<8&&Math.abs(a.r-r0)<5)a.alarm=Math.max(a.alarm,2.2);
  if(a.job){a.job=null;resetTask(a);}}
 jobs.length=0;jobT=1.2;
 for(let q=0;q<10;q++)spark(c0+(rnd()-.5)*6,r0+(rnd()-.5)*3,[':','.','#'][q%3],hsl(32,45,55),.6,(rnd()-.5)*6,-3);
}
function alarmAt(x,y){const [c0,r0]=cellAt(x,y);SND('tick');for(const a of ants){if(Math.abs(a.c-c0)<=5&&Math.abs(a.r-r0)<=3)a.alarm=2.6;}
 for(const f of foes)if(Math.abs(f.c-c0)<=3&&Math.abs(f.r-r0)<=2){f.hp-=1.2;f.hit=.2;spark(f.c,f.r-1,'*',hsl(50,90,75),.3);}}
function digTo(x,y){const [c,r]=cellAt(x,y);if(r<=S)return;SND('scratch',{min:70});
 if(lastC>=0){const st=Math.max(Math.abs(c-lastC),Math.abs(r-lastR)*2,1);
  for(let k=0;k<=st;k++){const cc_=Math.round(lastC+(c-lastC)*k/st),rr=Math.round(lastR+(r-lastR)*k/st);
   [0,1].forEach(o=>{if(!inb(cc_+o,rr)||rr<=S)return;const i=idx(cc_+o,rr);if(OBS[i]){if(rnd()<.2)spark(cc_+o,rr-1,'*',hsl(45,40,85),.3);return;}if(carve(cc_+o,rr)&&RID[i]<0)NEWT[i]=tN;});}}
 else{carve(c,r,tN);carve(c+1,r,tN);}
 if(rnd()<.5)spark(c,r-.5,[':','.',','][(rnd()*3)|0],hsl(30,40,55),.5,(rnd()-.5)*5,-3);
 lastC=c;lastR=r;}
addEventListener('pointerdown',e=>{held=true;moved0=false;blocked=false;px0=e.clientX;py0=e.clientY;downT=tN;lastC=-1;lastP=[px0,py0];
 const [c,r]=cellAt(px0,py0);heldSurf=r<S;
 scareCritters(px0,py0);
 if(heldSurf){dropFood(px0,py0);lastFood=tN;}else{alarmAt(px0,py0);}
 if(!touched){touched=true;hint.style.opacity=0;}});
addEventListener('pointermove',e=>{if(!held)return;const x=e.clientX,y=e.clientY;
 if(!moved0&&Math.hypot(x-px0,y-py0)>12)moved0=true;
 if(!moved0||blocked)return;
 const [c,r]=cellAt(x,y);
 if(r<S){const dx=x-lastP[0];for(let q=-4;q<=4;q++){const k=cl(c+q,0,cols-1);WX[k]=cl(WX[k]+dx*.03*(1-Math.abs(q)/5),-2.5,2.5);}heldSurf=true;}
 else{heldSurf=false;if(lastC<0){const [c0,r0]=cellAt(lastP[0],lastP[1]);if(r0>S){lastC=c0;lastR=r0;}}digTo(x,y);}
 lastP=[x,y];px0=x;py0=y;});
addEventListener('pointerup',()=>{held=false;heldSurf=false;lastC=-1;});
addEventListener('pointercancel',()=>{held=false;heldSurf=false;lastC=-1;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
window._antEv=()=>{startEvent();nextEvent=tN+999;};
})();
</script>
