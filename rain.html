<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>글자 빗창</title>
<style>
html,body{margin:0;height:100%;background:#0b0a0c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#g{filter:blur(6px) saturate(1.3);opacity:.7;mix-blend-mode:screen;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:calc(25% + env(safe-area-inset-bottom));text-align:center;color:#fff;font:600 14px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;letter-spacing:.03em;text-shadow:0 1px 10px #000,0 0 3px #000;transition:opacity 1.4s;pointer-events:none;opacity:.9}
#hint small{display:block;font-weight:500;opacity:.75;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div id="hint">쓱쓱 · 톡 · 꾸욱<small>김 서린 유리에 글씨 쓰기 · 고양이·시계·찻잔 톡 · 번개</small></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});
const gv=document.getElementById('g'),gx=gv.getContext('2d');
const hint=document.getElementById('hint');
const fcv=document.createElement('canvas'),fctx=fcv.getContext('2d');let fimg,FD;
const FONT='"SF Mono",ui-monospace,Menlo,Consolas,monospace';
let W,H,dpr,cols,rows,cw,chH,fs,asp,n,fontStr,LAND=false;
let FX0,FX1,FY0,FY1,MX,MY,SILL,FOG,TR,WT,OVk,OVc,OVs;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random;
const cc=new Map();
function hsl(h,s,l){h=((h%360)+360)%360;h=(h/4|0)*4;s=cl(s,0,100);s=(s/5|0)*5;l=cl(l,0,100);l=(l/2|0)*2;
 const k=h*1000000+s*1000+l;let v=cc.get(k);if(!v){v='hsl('+h+','+s+'%,'+l+'%)';cc.set(k,v);}return v;}
const SND=(n,o)=>{try{if(parent!==window&&parent.SFX)parent.SFX.play(n,o);}catch(e){}},SNDSET=(k,v)=>{try{if(parent!==window&&parent.SFX)parent.SFX.set(k,v);}catch(e){}};
let tN=0,last=0,fid=0,shower=0,showerT=0,nextShower=40,flash=0,dusk=0;
let rainK=1,clearT=0,nextClear=65,blackT=-99,lampOn=true,candleOn=true,RL=1,chimeT=0;
try{const m=location.hash.match(/^#t(\d+)$/);if(m)tN=+m[1];}catch(e){}
const power=d=>tN-blackT>d; // 정전 후 d초가 지나면 다시 켜짐

// ---------- layout ----------
let houses=[],lamps=[],walkers=[],drops=[],cat=null,steam=[],carL=null,nextCar=8,puds=[],rips=[],spray=[],zz=[],hearts=[],mug={heat:1};
let CAT0,MUGC,PLC,MUGY,PLY,DK,BK,CN,MB,YN;const smoke=[],notes=[];
function build(){
 n=cols*rows;FOG=new Float32Array(n);TR=new Float32Array(n);WT=new Float32Array(n).fill(-99);OVk=new Array(n);OVc=new Array(n);OVs=new Int32Array(n);
 LAND=W>H;
 FX0=2;FX1=cols-3;FY0=2;SILL=Math.round(rows*(LAND?.78:.8));
 FY1=SILL-1;MX=Math.round((FX0+FX1)/2);MY=Math.round(lerp(FY0,FY1,.42));
 for(let i=0;i<n;i++){const c=i%cols,r=(i/cols)|0;FOG[i]=fogTarget(c,r)*.9;}
 houses=[];let x=0;while(x<1.05){const w=.1+hash(x*99,1)*.14,ap=.46+hash(x*99,2)*.1;houses.push({x0:x,x1:x+w,ap,ch:hash(x*99,3)<.5,hue:[10,25,200,0,35][(hash(x*99,4)*5)|0]});x+=w+.01;}
 lamps=[];for(let u=.08;u<1;u+=.26)lamps.push(u);
 const pw=FX1-FX0;puds=[.22,.5,.78].map((u,k)=>({c:Math.round(FX0+(u+(hash(k,7)-.5)*.08)*pw),w:2+(hash(k,9)*3|0),hit:-9}));
 walkers=[];drops=[];rips=[];spray=[];for(let k=0;k<160;k++)drops.push(newBead());
 CAT0=FX0+Math.round(pw*.07)+3;
 cat={st:'sit',t:3,tail:0,look:1,paw:0,c:CAT0,meow:0,lvl:'sill',by:SILL-1,dir:1,tx:0,jp:null};steam=[];zz=[];hearts=[];
 // 책상과 탁상시계 자리
 const D=rows-2;DK={d:D,big:!LAND,x:Math.round(cols*(LAND?.84:.82)),ring:0};
 BK={x:Math.round(cols*(LAND?.06:.03)),turn:-1,next:6};
 CN={x:Math.round(cols*(LAND?.22:.3)),on:true};
 MB={x:Math.round(cols*(LAND?.42:.44)),open:false,i:0,nt:0,close:0};
 YN={x:cols*(LAND?.64:.38),vx:0,rot:0,trail:[]};
 MUGC=Math.round(cols*(LAND?.32:.39));MUGY=D-1;
 if(LAND){PLC=Math.round(cols*.57);PLY=D-1;}else{PLC=DK.x+4;PLY=D-9;}
}
function fogTarget(c,r){const u=(c-FX0)/(FX1-FX0),v=(r-FY0)/(FY1-FY0),e=Math.min(u,1-u,v*1.2,(1-v)*.7);return cl(.95-e*1.4,.6,.95)*(1+shower*.08)*(1-(1-rainK)*.45);}
function newBead(x,y,s){return{x:x!==undefined?x:FX0+rnd()*(FX1-FX0),y:y!==undefined?y:FY0+rnd()*(FY1-FY0),s:s!==undefined?s:rnd()*.5,vy:0,ph:rnd()*9};}
function inPane(c,r){return c>=FX0&&c<=FX1&&r>=FY0&&r<=FY1&&c!==MX&&r!==MY;}
function inFrame(c,r){return c>=FX0-2&&c<=FX1+2&&r>=FY0-2&&r<SILL;}
const ROADV=.95;

// ---------- outside scene ----------
const BOW=[0,28,52,120,205,275];
function outside(c,r,rn){ // [글자,색,밝기,배경]
 const u=(c-FX0)/(FX1-FX0),v=(r-FY0)/(FY1-FY0),lit=1-dusk*.3,bowK=1-rainK;
 const rs=hash(c,((r-tN*(18+shower*14))|0)>>1);if(rs<(.035+shower*.06)*rainK&&v<.9)return['|',hsl(210,15,52),0];
 if(v<.38){const cl2=vn(c*.08-tN*.06,r*.25)-bowK*.18;
  if(bowK>.05){const dx=(u-.5)*(FX1-FX0),dy=(v-.52)*(FY1-FY0)*asp,R0=.4*(FX1-FX0),b=Math.floor((Math.hypot(dx,dy)-R0)/1.2);
   if(b>=0&&b<6&&cl2<.62&&hash(c,r+b)<bowK*1.1)return[rn<.5?':':'.',hsl(BOW[b],75,60),0,hsl(BOW[b],55,26*bowK+8)];
   if(((c+r*1.6+tN*.6)%17)<1.1&&rn<bowK*.8)return['/',hsl(48,80,70),20];}
  return[cl2>.55?(cl2>.7?':':'.'):' ',hsl(215,12+bowK*10,30+cl2*16-shower*6+bowK*14),0];}
 if(v<.47){const hl=.4+.05*Math.sin(u*9)+.03*Math.sin(u*23);if(v>hl)return[rn<.4?'^':rn<.6?'n':'.',hsl(200-bowK*60,14+bowK*20,30+bowK*6),0,hsl(205-bowK*60,16,15+bowK*3)];return[' ','',0];}
 for(const h of houses){if(u<h.x0||u>h.x1)continue;const hw=h.x1-h.x0,mid=(h.x0+h.x1)/2,du=Math.abs(u-mid)/(hw/2);
  const roofTop=h.ap,eave=h.ap+.1;
  if(h.ch&&Math.abs(u-(mid+hw*.25))<.01&&v>roofTop-.04&&v<roofTop+.04)return['#',hsl(20,20,34),0,hsl(20,15,12)];
  if(v>=roofTop+du*(eave-roofTop)&&v<eave+.01)return[du>.92?(u<mid?'/':'\\'):(((r+c)%2)?'=':'-'),hsl(h.hue,40,40+(1-du)*8),0,hsl(h.hue,35,15)];
  if(v>=eave&&v<.82){const wx=((u-h.x0)/hw*6)%2,wy=((v-eave)/(.82-eave)*4)%2;
   if(wx>.5&&wx<1.5&&wy>.6&&wy<1.6){const id=Math.floor((u-h.x0)/hw*3)+Math.floor((v-eave)*40)*7+Math.floor(h.x0*99);
    const on=hash(id,Math.floor(tN/14))<.65*lit&&power(1.2+hash(id,5)*9);
    return on?[rn<.5?'#':'=',hsl(42,90,62),40,hsl(38,70,28)]:['.',hsl(220,10,30),0,hsl(225,15,9)];}
   return[rn<.15?':':' ',hsl(25,12,26),0,hsl(25+h.hue*.1,12,11)];}}
 if(v>=.82){ // 젖은 길
  const rr=Math.round(FY0+ROADV*(FY1-FY0));
  if(r===rr)for(const p of puds)if(Math.abs(c-p.c)<=p.w){const sh=hash(c,(tN*3)|0)<.3;return[sh?'~':'-',hsl(205,35,sh?55:40),10,hsl(215,30,14)];}
  for(const lu of lamps){const du=Math.abs(u-lu)*(FX1-FX0),on=power(2+hash(lu*99,3)*7);
   if(du<.6&&v<.9)return['|',hsl(40,20,40),0];if(du<.6&&v<.92&&v>=.9)return on?['*',hsl(45,100,75),45]:['o',hsl(40,10,35),0];
   if(on&&du<2&&v>.92&&hash(c,r+((tN*4)|0))<.6)return[du<.6?'|':'.',hsl(45,80,45+(2-du)*10),45,hsl(40,40,12)];}
  return[rn<.3?(rn<.1?'~':'-'):' ',hsl(220,15,26+rn*12),0,hsl(225,14,9)];}
 return[' ','',0];}

// ---------- helpers ----------
const FR=[];function putF(c,r,ch,col,nb){FR.push(Math.round(c),Math.round(r),ch,col,nb?1:0);}
function putN(c,r,ch,col){c=Math.round(c);r=Math.round(r);if(c<0||r<0||c>=cols||r>=rows)return;const i=r*cols+c;OVk[i]=ch;OVc[i]=col;OVs[i]=fid;}
function putO(c,r,ch,col){if(inPane(Math.round(c),Math.round(r)))putN(c,r,ch,col);}
function str(c,r,s,col,f){for(let q=0;q<s.length;q++)if(s[q]!==' '||f)(f||putN)(c+q,r,s[q],typeof col==='function'?col(s[q],q):col);}
function wipe(cx,cy,rad){for(let r=Math.floor(cy-rad/asp-1);r<=cy+rad/asp+1;r++)for(let c=Math.floor(cx-rad-1);c<=cx+rad+1;c++){if(c<0||r<0||c>=cols||r>=rows)continue;const d=Math.hypot(c-cx,(r-cy)*asp);if(d<rad){const i=r*cols+c;FOG[i]=Math.min(FOG[i],(d/rad)*.25);WT[i]=tN;}}
 for(let k=drops.length-1;k>=0;k--){const d=drops[k];if(Math.hypot(d.x-cx,(d.y-cy)*asp)<rad&&d.s<.9)drops.splice(k,1);}}
function catHit(c,r){return Math.abs(c-(cat.c+2))<5.5&&r>cat.by-5&&r<=cat.by+1.5;}
function lvlY(l){return l==='sill'?SILL-1:DK.d-1;}
function lvlX(l){return l==='sill'?[FX0+4,FX1-9]:[4,cols-10];}
function catJump(to,x1){const C=cat;if(C.st==='jump')return;const b=lvlX(to);C.jp={x0:C.c,y0:C.by,x1:cl(x1,b[0],b[1]),y1:lvlY(to),to,t:0};C.dir=C.jp.x1>=C.c?1:-1;C.st='jump';C.t=9;C.paw=0;}
function near(c,r,x,y,rx,ry){return Math.abs(c-x)<=rx&&Math.abs(r-y)<=ry;}

// ---------- update ----------
function update(dt){
 dusk=.5+.5*Math.sin(tN*.02);
 // 비 그침 → 무지개 → 다시 비
 nextClear-=dt;if(nextClear<0&&clearT<=0&&shower<=0){clearT=20+rnd()*8;nextClear=clearT+60+rnd()*35;}
 if(clearT>0)clearT-=dt;
 rainK=cl(rainK+(clearT>0?-dt*.25:dt*.2),0,1);
 nextShower-=dt;if(nextShower<0&&shower<=0&&clearT<=0){shower=1;showerT=14+rnd()*8;nextShower=55+rnd()*30;SND('thunder');}
 if(showerT>0){showerT-=dt;if(showerT<=0)shower=0;}
 const sh=shower>0?Math.min(1,showerT/2):0;SNDSET('rain',rainK*(.35+sh*.65));
 if(shower>0&&rnd()<dt*.08)lightning(rnd()<.3);
 flash=Math.max(0,flash-dt*2.5);
 RL+=((lampOn&&power(3.5)?1:.5)-RL)*Math.min(1,dt*4);
 // 김이 다시 서림
 for(let i=0;i<n;i++){const c=i%cols,r=(i/cols)|0;if(!inPane(c,r))continue;const tg=fogTarget(c,r);if(FOG[i]<tg){const w=tN-WT[i];if(w>2)FOG[i]=Math.min(tg,FOG[i]+dt*.03*(.5+hash(c*3,r*5))*Math.min(1,(w-2)/6));}else if(FOG[i]>tg+.05)FOG[i]-=dt*.04;TR[i]=Math.max(0,TR[i]-dt*.05);}
 // 유리 물방울
 const spawn=dt*(10+sh*40)*rainK;for(let k=0;k<spawn;k++)if(rnd()<spawn-k&&drops.length<320)drops.push(newBead(undefined,undefined,rnd()*.35));
 for(let k=drops.length-1;k>=0;k--){const d=drops[k];
  if(d.s<.75){d.s+=dt*(.004+sh*.02)*rnd()*rainK;if(rnd()<dt*.02*rainK)d.s+=.15;if(rainK<.3&&rnd()<dt*.03){drops.splice(k,1);}continue;}
  d.vy=Math.min(14,d.vy+dt*(3+d.s*4));const ny=d.y+d.vy*dt*(rnd()<.1?0:1);d.x+=Math.sin(d.y*1.3+d.ph)*dt*.6;
  for(let y=Math.floor(d.y);y<=ny;y++){const i=y*cols+Math.round(d.x);if(i>=0&&i<n){TR[i]=1;FOG[i]=Math.min(FOG[i],.15);}}
  d.y=ny;d.s-=dt*.05;if(rnd()<dt*1.5)drops.push(newBead(d.x,d.y-.5,.25));
  for(let q=drops.length-1;q>=0;q--){const e=drops[q];if(e!==d&&Math.abs(e.x-d.x)<.9&&Math.abs(e.y-d.y)<.7){d.s+=e.s*.5;drops.splice(q,1);if(q<k)k--;}}
  if(d.y>FY1||Math.round(d.y)===MY&&rnd()<.4){drops.splice(drops.indexOf(d),1);continue;}}
 const rr=Math.round(FY0+ROADV*(FY1-FY0)),pw=FX1-FX0;
 // 웅덩이 물결
 if(rnd()<dt*9*rainK*(1+sh)){const p=puds[(rnd()*puds.length)|0];rips.push({c:p.c+Math.round((rnd()-.5)*2*p.w),r:rr,a:0});}
 if(rnd()<dt*5*rainK){rips.push({c:FX0+Math.round(rnd()*pw),r:rr-1+Math.round(rnd()*2),a:.3});}
 for(let k=rips.length-1;k>=0;k--){const p=rips[k];p.a+=dt;if(p.a>.9){rips.splice(k,1);continue;}const col=hsl(205,40,70-p.a*30);
  if(p.a<.25)putO(p.c,p.r,'o',col);else if(p.a<.55){putO(p.c-1,p.r,'(',col);putO(p.c+1,p.r,')',col);}else{putO(p.c-2,p.r,'(',col);putO(p.c+2,p.r,')',col);}}
 // 걷는 사람 (비 그치면 우산 접기)
 if(rnd()<dt*.25&&walkers.length<5){const R_=rnd()<.5;walkers.push({u:R_?-.05:1.05,d:R_?1:-1,sp:.025+rnd()*.02,h:[0,200,45,300,150][(rnd()*5)|0],fl:0});}
 for(let k=walkers.length-1;k>=0;k--){const w=walkers[k];w.u+=w.d*w.sp*dt;w.fl+=dt*4;if(w.u<-.1||w.u>1.1){walkers.splice(k,1);continue;}
  const c=FX0+w.u*pw,r=FY0+.86*(FY1-FY0);
  if(rainK>.4){putO(c-1,r,'/',hsl(w.h,70,48));putO(c,r,'^',hsl(w.h,70,48));putO(c+1,r,'\\',hsl(w.h,70,48));}else{putO(c,r,'o',hsl(30,30,55));putO(c+w.d,r+1,'|',hsl(w.h,60,45));}
  putO(c,r+1,((w.fl|0)%2)?'|':'(',hsl(220,10,30));}
 // 자동차 + 물 튀김
 if(!carL&&tN>nextCar){const R_=rnd()<.5;carL={u:R_?-.1:1.1,d:R_?1:-1};nextCar=tN+12+rnd()*10;}
 if(carL){carL.u+=carL.d*.09*dt;const c=FX0+carL.u*pw,r=rr;str(Math.round(c)-2,r,'[==]',hsl(220,15,40),putO);putO(c+carL.d*3,r,'*',hsl(55,100,85));
  for(let q=4;q<12;q++)if(rnd()<.5)putO(c+carL.d*q,r,'.',hsl(52,80,60));
  for(const p of puds)if(Math.abs(c-p.c)<=p.w&&tN-p.hit>1.5){p.hit=tN;SND('splash',{min:600});for(let q=0;q<14;q++)spray.push({x:c-carL.d*2,y:r,vx:(rnd()-.5)*8-carL.d*3,vy:-(3+rnd()*5),a:0});}
  if(carL.u<-.15||carL.u>1.15)carL=null;}
 for(let k=spray.length-1;k>=0;k--){const s=spray[k];s.a+=dt;s.vy+=dt*14;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.a>1.1||s.y>rr+.5){spray.splice(k,1);continue;}putO(s.x,s.y,s.vy<0?"'":',',hsl(205,40,72));}
 // 고양이
 const C=cat;C.t-=dt;C.tail+=dt*(C.st==='pet'||C.st==='startle'||C.st==='watch'?7:C.st==='sleep'?.6:1.6);C.paw=Math.max(0,C.paw-dt);C.meow=Math.max(0,C.meow-dt);
 if(C.st==='jump'){const j=C.jp;j.t+=dt/.75;const k=Math.min(1,j.t);C.c=lerp(j.x0,j.x1,k);C.by=lerp(j.y0,j.y1,k)-Math.sin(k*Math.PI)*3;
  if(k>=1){C.lvl=j.to;C.by=j.y1;C.c=j.x1;C.st='sit';C.t=1.2+rnd()*2;SND('peck',{min:200});}}
 else if(C.st==='walk'||C.st==='chase'){if(C.st==='chase')C.tx=YN.x;const b=lvlX(C.lvl),tx=cl(C.tx,b[0],b[1]),dx=tx-C.c,sp=C.st==='chase'?12:4.5;C.dir=dx>=0?1:-1;C.look=C.dir;
  if(Math.abs(dx)<.6){if(C.st==='chase'&&Math.abs(YN.x-C.c-2)<4){YN.vx=(rnd()<.5?-1:1)*(10+rnd()*12);SND('scratch');C.st='watch';C.t=1.5;}else if(C.st!=='chase'){C.st='sit';C.t=2+rnd()*3;}}
  else C.c+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);}
 else if(C.t<0){const q=rnd();C.paw=0;
  if(q<.32){C.st='walk';const b=lvlX(C.lvl);C.tx=b[0]+rnd()*(b[1]-b[0]);C.t=9;}
  else if(q<.46){const to=C.lvl==='sill'?'desk':'sill';catJump(to,C.c+(rnd()-.5)*10);}
  else if(q<.66){C.st='sit';C.t=3+rnd()*4;C.look=rnd()<.5?1:-1;if(C.lvl==='sill'&&rnd()<.45){const sl=drops.find(d=>d.vy>2&&Math.abs(d.x-C.c)<12&&d.y>FY1-12);if(sl){C.paw=1.2;C.pawX=sl.x;}}}
  else if(q<.77){C.st='groom';C.t=3+rnd()*3;}
  else if(q<.92){C.st='sleep';C.t=10+rnd()*10;}
  else{C.st='stretch';C.t=2.2;}}
 if(C.st==='sleep'&&rnd()<dt*.8)zz.push({x:C.c+4,y:C.by-2,a:0});
 for(let k=zz.length-1;k>=0;k--){const z=zz[k];z.a+=dt;z.y-=dt*1.1;z.x+=dt*.7;if(z.a>2.6)zz.splice(k,1);}
 if(C.st==='pet'&&rnd()<dt*2.5)hearts.push({x:C.c+2+(rnd()-.5)*3,y:C.by-4,a:0});
 for(let k=hearts.length-1;k>=0;k--){const z=hearts[k];z.a+=dt;z.y-=dt*1.5;if(z.a>1.6)hearts.splice(k,1);}
 // 책장 넘김
 BK.next-=dt;if(BK.next<0&&BK.turn<0){BK.turn=0;BK.next=7+rnd()*9;SND('flutter',{min:500});}

 ctx.globalCompositeOperation='lighter';
 if(CN.on){const cx=CN.x*cw,cy=flameY()*chH,fl=.11+.03*Math.sin(tN*11),g=ctx.createRadialGradient(cx,cy,0,cx,cy,cw*16);g.addColorStop(0,`rgba(255,180,90,${fl.toFixed(3)})`);g.addColorStop(1,'rgba(255,180,90,0)');ctx.fillStyle=g;ctx.fillRect(cx-cw*16,cy-cw*16,cw*32,cw*32);}
 if(power(3.5)){const cx=DK.x*cw,cy=(DK.d-(DK.big?4:2))*chH,g=ctx.createRadialGradient(cx,cy,0,cx,cy,cw*(DK.big?22:12));g.addColorStop(0,'rgba(255,150,60,.10)');g.addColorStop(1,'rgba(255,150,60,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
 ctx.globalCompositeOperation='source-over';
 gx.clearRect(0,0,gv.width,gv.height);gx.drawImage(cv,0,0,gv.width,gv.height);
 requestAnimationFrame(frame);
}

// ---------- touch ----------
let held=false,touched=false,px0=0,py0=0,downT=0,moved=false,lp=false,lastWipe=0,onProp=false;
function alarm(){DK.ring=2.2;for(let q=0;q<10;q++)setTimeout(()=>SND('chime',{f:q%2?1320:1568,min:0}),q*110);if(cat.st==='sleep'){cat.st='startle';cat.t=1.2;}}
function chime(){chimeT=1.6;const d=new Date(),k=Math.min(4,(d.getHours()%12)||12);for(let q=0;q<k;q++)setTimeout(()=>SND('chime',{f:q%2?660:880,min:0}),q*420);}
function tap(x,y){const c=x/cw,r=y/chH;
 if(catHit(c,r)){if(cat.st!=='jump'){cat.st='sit';cat.t=3;}cat.look*=-1;cat.meow=1.2;SND('meow');return true;}
 if(near(c,r,MUGC+1,MUGY-.5,2.5,2)){mug.heat=1;for(let k=0;k<8;k++)steam.push({x:MUGC+1,y:MUGY-1,a:rnd()*.4,ph:rnd()*9});SND('bubble',{p:.7});setTimeout(()=>SND('bubble',{p:.9}),120);return true;}
 if(near(c,r,DK.x,DK.d-(DK.big?4:2),DK.big?11:6,DK.big?4.5:2)){alarm();return true;}
 if(near(c,r,CN.x,(DK.d+flameY())/2,2.5,DK.big?5:2.5)){CN.on=!CN.on;if(!CN.on){CN.smk=1.6;SND('whoosh',{v:.25});}else SND('tick');return true;}
 if(near(c,r,MB.x+5,DK.d-(DK.big?3:2),5,DK.big?3.5:2)){if(!MB.open){MB.open=true;MB.i=0;MB.nt=.3;MB.close=0;SND('tick');}else{MB.open=false;SND('tick');}return true;}
 if(near(c,r,YN.x,DK.d,2.5,1.5)){const dir=YN.x>cols*.5?-1:1;YN.vx=dir*(14+rnd()*10);SND('scratch');if(cat.lvl==='sill'&&cat.st!=='sleep'&&rnd()<.6)setTimeout(()=>catJump('desk',YN.x),400);return true;}
 if(near(c,r,BK.x+6,DK.d-(DK.big?4:2),7,DK.big?4:2.5)){if(BK.turn<0){BK.turn=0;SND('flutter',{min:300});}return true;}
 if(inPane(Math.round(c),Math.round(r))){drops.push(newBead(c,r,.8));SND('drip');}
 return false;
}
addEventListener('pointerdown',e=>{held=true;moved=false;lp=false;px0=e.clientX;py0=e.clientY;downT=tN;onProp=tap(e.clientX,e.clientY);if(!touched){touched=true;hint.style.opacity=0;}});
addEventListener('pointermove',e=>{if(!held)return;const x=e.clientX,y=e.clientY;if(!moved&&Math.hypot(x-px0,y-py0)>10)moved=true;
 if(moved){const c=x/cw,r=y/chH,c0=px0/cw,r0=py0/chH;
  if(catHit(c,r)&&cat.st!=='jump'){if(cat.st!=='pet'){cat.st='pet';}cat.t=1.6;SND('purr',{min:1700});px0=x;py0=y;return;}
  const st=Math.max(1,Math.ceil(Math.hypot(c-c0,r-r0)));for(let k=1;k<=st;k++)wipe(c0+(c-c0)*k/st,r0+(r-r0)*k/st,2.3);
  if(inPane(Math.round(c),Math.round(r))&&rnd()<.05)drops.push(newBead(c,r+.6,.8));
  if(tN-lastWipe>.25){lastWipe=tN;SND('scratch');}px0=x;py0=y;}});
addEventListener('pointerup',()=>{held=false;});
addEventListener('pointercancel',()=>{held=false;});
addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(held&&!moved&&!lp&&!onProp&&tN-downT>.5){lp=true;if(rainK<.5){clearT=0;rainK=.5;}lightning(rnd()<.5);}},60);
window._rain={pos:()=>({cw,chH,MB:MB.x,YN:YN.x,CN:CN.x,D:DK.d}),clear:()=>{clearT=25;rainK=0;},black:()=>lightning(true),st:s=>{cat.st=s;cat.t=99;},cat:()=>cat,jump:()=>catJump(cat.lvl==='sill'?'desk':'sill',cat.c)};
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);
})();
</script>
</body>
