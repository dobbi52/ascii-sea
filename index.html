<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>글자 풍경</title>
<style>
html,body{margin:0;height:100%;background:#020814;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#020814}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#sw{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;align-items:flex-start;gap:6px;padding:5px;border-radius:12px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#scenes{display:flex;flex-direction:column;gap:6px}
.it{display:none;align-items:center;gap:7px;flex-direction:row-reverse;cursor:pointer}
.it.on{display:flex;order:-1}
#sw.open .it{display:flex;animation:drop .28s ease both}
#sw.open .it:nth-child(2){animation-delay:.04s}#sw.open .it:nth-child(3){animation-delay:.08s}#sw.open .it:nth-child(4){animation-delay:.12s}#sw.open .it:nth-child(5){animation-delay:.16s}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.it span{display:none;font:600 11px/1 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;color:rgba(255,255,255,.75);white-space:nowrap}
#sw.open .it span{display:block}
.it canvas{width:52px;height:34px;border-radius:7px;display:block;opacity:.6;outline:1px solid rgba(255,255,255,.15);transition:opacity .3s,outline-color .3s}
.it.on canvas{opacity:1;outline:1.5px solid var(--hi)}
#sw.open .it.on span{color:#fff}
.it.on::after{content:"";display:none}
#more{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);font:700 8px/1 "SF Mono",ui-monospace,monospace;color:rgba(255,255,255,.55);pointer-events:none}
#snd{width:34px;height:34px;border-radius:7px;cursor:pointer;display:block;outline:1px solid rgba(255,255,255,.15);opacity:.6;transition:opacity .3s}
#snd.on{opacity:1;outline-color:rgba(255,255,255,.55)}
</style>
</head>
<body>
<iframe id="f" title="글자 풍경"></iframe>
<canvas id="fx"></canvas>
<div id="sw"><div id="scenes"><div class="it" data-s="sea" style="--hi:#6fe0ff"><canvas data-s="sea" aria-label="바닷속"></canvas><span>바닷속</span></div><div class="it" data-s="forest" style="--hi:#9fe070"><canvas data-s="forest" aria-label="숲속 연못"></canvas><span>숲속 연못</span></div><div class="it" data-s="ant" style="--hi:#f0a060"><canvas data-s="ant" aria-label="개미굴"></canvas><span>개미굴</span></div><div class="it" data-s="city" style="--hi:#ffcf5f"><canvas data-s="city" aria-label="도시 야경"></canvas><span>도시 야경</span></div></div><canvas id="snd" aria-label="소리 켜기/끄기"></canvas></div>
<script>document.write('<script src="sfx.js?v='+Date.now()+'"><\/script>')</script>
<script>
(()=>{
const SC={sea:{src:'sea.html',hues:[185,200,45,320,24]},forest:{src:'forest.html',hues:[95,120,60,352,196]},ant:{src:'ant.html',hues:[24,12,40,95,30]},city:{src:'city.html',hues:[42,185,320,0,55]}};
const f=document.getElementById('f'),fx=document.getElementById('fx'),c=fx.getContext('2d'),btns=[...document.querySelectorAll('#sw canvas[data-s]')];
const GL='@#%&*+=~-:;.oO0/\\|<>';
let cur=null,busy=false;
function size(){const d=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*d;fx.height=innerHeight*d;c.setTransform(d,0,0,d,0,0);}
size();addEventListener('resize',size);
const items=[...document.querySelectorAll('.it')],sw=document.getElementById('sw');let closeT=null;
function mark(s){items.forEach(b=>b.classList.toggle('on',b.dataset.s===s));}
function setOpen(v){sw.classList.toggle('open',v);clearTimeout(closeT);if(v)closeT=setTimeout(()=>setOpen(false),5000);}
function pick(){let h=(location.hash||'').slice(1);if(h==='neon')h='city';return SC[h]?h:'sea';}
// glyph dissolve: 0..1 cover, then 1..0 reveal
function noise(t,hues){
 const W=innerWidth,H=innerHeight,cw=Math.max(6,W/60),ch=cw*1.7;
 c.clearRect(0,0,W,H);if(t<=0)return;
 c.font='bold '+(cw*1.6).toFixed(1)+'px "SF Mono",ui-monospace,Menlo,monospace';c.textBaseline='top';
 c.fillStyle='rgba(2,8,20,'+(t*.92).toFixed(3)+')';c.fillRect(0,0,W,H);
 for(let y=0;y<H;y+=ch)for(let x=0;x<W;x+=cw){
  const r=Math.random();if(r>t*1.05)continue;
  const h=hues[(Math.random()*hues.length)|0];
  c.fillStyle='hsl('+h+',80%,'+(40+Math.random()*40)+'%)';c.fillText(GL[(Math.random()*GL.length)|0],x,y);}
}
function anim(dur,from,to,hues){return new Promise(res=>{const t0=performance.now();
 (function st(n){const k=Math.min(1,(n-t0)/dur);noise(from+(to-from)*k,hues);if(k<1)requestAnimationFrame(st);else res();})(t0);});}
async function go(s,instant){
 if(s===cur||busy)return;busy=true;mark(s);
 const hues=SC[s].hues.concat(cur?SC[cur].hues:[]);
 if(!instant){SFX.play('glitch');await anim(380,0,1,hues);}
 await new Promise(res=>{f.onload=()=>res();f.src=SC[s].src+'?v='+Date.now();setTimeout(res,1500);});
 cur=s;SFX.setScene(s);try{f.contentWindow.focus();}catch(e){}
 if(!instant)await anim(520,1,0,SC[s].hues);
 c.clearRect(0,0,innerWidth,innerHeight);busy=false;
 if(pick()!==s)go(pick());
}
try{if(localStorage.getItem('ascii-snd')==='1'){/* needs a tap: show as off until pressed */}}catch(e){}
items.forEach(b=>b.addEventListener('click',()=>{const s=b.dataset.s,open=sw.classList.contains('open');
 if(!open){setOpen(true);return;}
 setOpen(false);if(s===cur)return;if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);go(s);}));
// sound toggle
const snd=document.getElementById('snd');snd.width=68;snd.height=68;
snd.addEventListener('click',()=>{const v=SFX.setOn(!SFX.isOn());snd.classList.toggle('on',v);try{localStorage.setItem('ascii-snd',v?'1':'0');}catch(e){}});
addEventListener('hashchange',()=>go(pick()));
// mini windows: tiny living dioramas
const MF='bold 9px "SF Mono",ui-monospace,Menlo,monospace';
btns.forEach(b=>{b.width=104;b.height=68;});
function hs(h,s,l){return'hsl('+h+','+s+'%,'+l+'%)';}
function drawSnd(t){const g=snd.getContext('2d'),o=SFX.isOn();g.setTransform(2,0,0,2,0,0);g.fillStyle='#10141c';g.fillRect(0,0,34,34);g.font=MF;g.textBaseline='top';
 g.fillStyle=o?'#e8f4ff':'#7d8794';g.fillText('[',5,12);g.fillText('>',10,12);
 if(o){for(let k=0;k<3;k++){const h=Math.round(2+3*Math.abs(Math.sin(t*6+k*1.3)));g.fillStyle='hsl('+(180+k*40)+',80%,70%)';g.fillRect(18+k*4,17-h,2,h*2);}}
 else{g.fillStyle='#d06060';g.fillText('x',19,12);}}
function mini(t){drawSnd(t);btns.forEach(b=>{const g=b.getContext('2d'),s=b.dataset.s;g.setTransform(2,0,0,2,0,0);
 const gr=g.createLinearGradient(0,0,0,34);
 if(s==='sea'){gr.addColorStop(0,'#0e5672');gr.addColorStop(1,'#04182a');}
 else if(s==='forest'){gr.addColorStop(0,'#2b4a22');gr.addColorStop(1,'#10200c');}
 else if(s==='city'){gr.addColorStop(0,'#0a0a24');gr.addColorStop(.62,'#2a1640');gr.addColorStop(.63,'#04050c');gr.addColorStop(1,'#04050c');}
 else{gr.addColorStop(0,'#8fcbe8');gr.addColorStop(.3,'#8fcbe8');gr.addColorStop(.31,'#3a2414');gr.addColorStop(1,'#1a0e07');}
 g.fillStyle=gr;g.fillRect(0,0,52,34);g.font=MF;g.textBaseline='top';
 const P=(ch,c,r,col)=>{g.fillStyle=col;g.fillText(ch,1+c*5.4,1+r*10.6);};
 if(s==='sea'){
  for(let c=0;c<10;c++)P(((c+(t*3|0))%3)?'~':'-',c,0,hs(185,80,70));
  const fx=((t*3.2)%14)-3;P('>',fx|0,1,hs(48,95,62));P('<',(fx|0)+1,1,hs(48,95,62));P('>',(fx|0)+2,1,hs(48,95,62));
  const fx2=9-((t*2.2+5)%14);P('<',fx2|0,1.6,hs(205,85,70));P('>',(fx2|0)+1,1.6,hs(205,85,70));
  P('o',7,1.2-((t*.8)%1.2),hs(190,60,88));
  for(let c=0;c<10;c++)P(c===2?'Y':c===7?'*':(c%3?'.':','),c,2,c===2?hs(330,70,65):c===7?hs(20,85,60):hs(40,40,55));
 }else if(s==='forest'){
  for(let c=0;c<10;c++){const tl=Math.sin(t*2.4-c*.6);P(tl>.35?'/':tl<-.35?'\\':'|',c,0,hs(100+c*4,55,55));}
  for(let c=0;c<10;c++){const tl=Math.sin(t*2.4-c*.6-1);P(c===3?'*':c===8?'@':(tl>.3?'/':'|'),c,1,c===3?hs(350,80,62):c===8?hs(50,90,62):hs(90,50,45));}
  for(let c=0;c<10;c++)P(c>1&&c<8?(((c+(t*2|0))%3)?'~':'-'):'.',c,2,c>1&&c<8?hs(196,70,62):hs(80,40,40));
 }else if(s==='city'){
  const hs2=[1,.4,.7,.2,.55,.3,.8,.45,.6,.35];
  for(let c=0;c<10;c++){const top=hs2[c]*1.6;for(let r=Math.ceil(top);r<2;r++)P(((c*3+r)%2)&&Math.sin(t+c*r)>-.3?'#':'.',c,r,(c%3)?hs(42,80,58):hs(185,55,54));if(top<1.9)P('_',c,top-.4,hs(235,20,40));}
  P('*',3,-.1,((t*2)|0)%2?hs(0,90,60):hs(0,40,20));
  for(let c=0;c<10;c++)P(((c+(t*2|0))%3)?'~':'-',c,2,(c%3)?hs(42,60,35):hs(225,30,30));
 }else{
  for(let c=0;c<10;c++)P(c===5?' ':Math.sin(t*2-c)>.3?'/':'|',c,-.05,hs(100,55,40));
  for(let c=0;c<10;c++){if(c>=1&&c<=8)continue;P('%',c,1,hs(26,40,30));}
  for(let c=0;c<10;c++)P(c===5||c===6?' ':'#',c,2,hs(26,38,24));
  const ax=1+((t*2.6)%8);P('8',ax|0,1,hs(12,80,60));P('>',(ax|0)+1,1,hs(14,85,68));P(',',(ax|0)+2,1,hs(42,70,62));
  P('o',5,2,hs(48,35,90));P('C',6,2,hs(45,45,80));
 }});}
(function mloop(){let lt=0;function st(n){if(n-lt>80){lt=n;mini(n/1000);}requestAnimationFrame(st);}requestAnimationFrame(st);})();
go(pick(),true);
})();
</script>
</body>
</html>
